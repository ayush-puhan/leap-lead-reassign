<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Last Working Day Mockup</title>
<style>
:root{
  --nav:#0b1220; --nav-line:#2a3446; --bg:#eef2f7; --card:#ffffff; --line:#dbe3ee; --line-soft:#e9eef5;
  --ink:#141b2b; --muted:#5b6679; --faint:#8a94a6; --blue:#2f5bea; --blue-soft:#eaf0ff;
  --green:#16a34a; --green-soft:#e8f7ee; --red:#dc2626; --red-soft:#fdecec; --amber:#b45309; --amber-soft:#fff4e0;
  --grey-soft:#f1f3f7; --orange:#e5471d; --demo:#fff7d6; --demo-line:#f0d98a;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* demo bar */
.demo{background:var(--demo);border-bottom:1px solid var(--demo-line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px}
.demo b{font-weight:600}
.demo select,.demo button{border:1px solid #d9c476;background:#fff;border-radius:6px;padding:5px 10px;font-size:13px}
.demo button:hover{background:#fffbea}
.demo .sp{flex:1}
.demo .clock{color:#6b5a14}

/* crm chrome */
.top{background:var(--nav);color:#fff;display:flex;align-items:center;gap:14px;padding:8px 16px;min-height:50px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:.5px}
.logo i{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#4f7cff,#9b5cff);display:inline-block}
.search{flex:1;min-width:160px;max-width:320px;border:1px solid var(--nav-line);border-radius:4px;padding:7px 10px;color:#9aa6ba;font-size:13px}
.vbtn{border:1px solid #cfd6e2;border-radius:3px;padding:6px 14px;font-size:12px;font-weight:600}
.top .sp{flex:1}
.bell{position:relative;background:none;border:0;color:#fff;padding:4px 6px;font-size:18px}
.bell .dot{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;font-size:10px;border-radius:9px;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 4px}
.who{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.av{width:28px;height:28px;border-radius:50%;background:#3b4a6b;display:grid;place-items:center;font-size:11px}
.bellpanel{position:absolute;right:16px;top:96px;width:min(360px,calc(100vw - 32px));background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 30px rgba(15,23,42,.18);z-index:30}
.bellpanel h4{margin:0;padding:10px 14px;border-bottom:1px solid var(--line-soft);font-size:13px}
.bellpanel .n{padding:10px 14px;border-bottom:1px solid var(--line-soft);font-size:13px}
.bellpanel .n:last-child{border-bottom:0}
.bellpanel .n small{display:block;color:var(--faint);font-size:11px;margin-top:2px}
.bellpanel .n button{margin-top:6px}
.bellpanel .empty{padding:18px 14px;color:var(--muted);font-size:13px}
.tabs{background:#fff;display:flex;gap:4px;padding:0 8px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs span{padding:10px 8px;font-size:13px;color:#3a4458;white-space:nowrap}
.tabs .on{color:var(--blue);font-weight:600;border-bottom:2px solid var(--blue)}
.banner{background:linear-gradient(90deg,#3453e0,#8a3be3 55%,#4a4fe0);color:#fff;font-weight:700;font-size:13px;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.banner span.j{background:#fff;color:#3453e0;border-radius:3px;padding:2px 8px;font-weight:600;font-size:12px}
.filters{background:#fff;padding:8px 16px;display:flex;gap:6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.filters span{border:1px solid var(--line);border-radius:4px;padding:5px 12px;font-size:12px}

main{padding:20px 16px 110px;max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.rtk{align-self:flex-end;background:var(--orange);color:#fff;border:0;border-radius:4px;padding:8px 14px;font-weight:700;font-size:12px}
h2.sec{margin:6px 0 0;font-size:18px;letter-spacing:.3px}
.tix{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tix div{background:#fff;border:1px solid var(--line);border-radius:8px;text-align:center;padding:14px 8px}
.tix small{font-size:11px;font-weight:600;letter-spacing:.5px;color:#3a4458}
.tix b{display:block;font-size:34px;line-height:1.2}
@media (max-width:560px){.tix{grid-template-columns:1fr}}
.whomenu{position:absolute;right:16px;top:96px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(15,23,42,.18);z-index:31;min-width:180px;overflow:hidden}
.whomenu button{display:flex;gap:10px;align-items:center;width:100%;background:#fff;border:0;padding:11px 16px;font-size:14px;color:var(--ink);text-align:left}
.whomenu button:hover{background:#f6f8fb}
.whomenu button+button{border-top:1px solid var(--line-soft)}
.whomenu .out{color:var(--red)}
.pcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:16px}
.pcard .top2{display:flex;gap:16px;align-items:center}
.pav{width:60px;height:60px;border-radius:50%;background:#e8590c;color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;flex:none}
.pcard h2{margin:0;font-size:20px}
.pcard .r{color:var(--muted);font-size:13px}
.ptiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.ptiles div{background:#f1f4f9;border-radius:10px;padding:12px 14px}
.ptiles small{display:block;font-size:11px;font-weight:700;letter-spacing:.4px;color:#4b566b;text-transform:uppercase}
.ptiles b{font-size:14px}

.card{background:var(--card);border:1px solid var(--line);border-radius:8px}
.chead{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;background:none;border:0;text-align:left;color:inherit}
.ic{width:30px;height:30px;border-radius:7px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-size:15px;flex:none}
.chead .t{flex:1;min-width:0}
.chead .t b{display:block;font-size:14px}
.chead .t small{color:var(--muted);font-size:12px}
.chev{color:var(--muted);transition:transform .15s}
.open .chev{transform:rotate(180deg)}
.cbody{border-top:1px solid var(--line-soft);padding:16px;display:flex;flex-direction:column;gap:14px}

.note{background:var(--grey-soft);border-radius:6px;padding:10px 12px;font-size:13px;color:#39445a}
.stagegrid{display:flex;flex-wrap:wrap;gap:8px}
.stagegrid div{border:1px solid var(--line);border-radius:6px;padding:8px 12px;min-width:92px}
.stagegrid small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.stagegrid b{font-size:18px}
.stagegrid .tot{background:var(--blue-soft);border-color:#c9d6ff}
.stagepick{position:relative}
.stagepick .panel label.all{font-weight:600;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:4px}
.stagepick .panel{position:absolute;top:100%;left:0;margin-top:4px;z-index:25;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 30px rgba(15,23,42,.18);padding:8px;max-height:300px;overflow:auto;min-width:280px;display:flex;flex-direction:column;gap:1px}
.stagepick .hdr{display:flex;justify-content:space-between;align-items:center;padding:2px 6px 8px;margin-bottom:4px;border-bottom:1px solid var(--line-soft);font-size:12px;font-weight:700}
.stagepick label{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:4px;font-size:13px;font-weight:400;cursor:pointer}
.stagepick label:hover{background:#f6f8fb}

/* Tasks & Performance — visual language borrowed from the counselor CRM's own tab: red "boost"
   cards for Action Required output metrics, green for volume/quality input metrics, and per-task
   cards with a "How to close" explainer for pipeline drawers. Only Boost STI / Boost Deposit
   are real in this mockup — the rest is static dressing. */
.boosthead{display:flex;align-items:center;gap:10px;margin:18px 0 2px;font-size:12px;font-weight:800;letter-spacing:.4px;color:#4b566b;text-transform:uppercase}
.boosthead .bar{width:4px;height:16px;background:var(--blue);border-radius:2px;display:inline-block}
.boosthead .pill{margin-left:auto;font-size:10px;font-weight:700;padding:3px 10px;border-radius:999px;text-transform:none;letter-spacing:.2px}
.pill-red{background:#fde2e1;color:#b42318}
.pill-amber{background:var(--amber-soft);color:var(--amber)}
.boostgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:820px){.boostgrid{grid-template-columns:repeat(2,1fr)}}
.boostcard{border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:150px;cursor:pointer;border:1px solid transparent}
.boostcard.red{background:linear-gradient(180deg,#fdeceb,#fbe0df)}
.boostcard.red{border-color:#f6c9c7}
.boostcard.purple{background:linear-gradient(180deg,#f4efff,#ebe2ff);border-color:#d9c9fb}
.boostcard.purple .bhead{color:#5b2bb5}
.boostcard.purple .bnum,.boostcard.purple .blink{color:#5b2bb5}
.asgt td{white-space:normal}.asgt td:first-child,.asgt th:first-child{width:36px}
.smt td.act{text-align:right;white-space:nowrap;width:1%}
.smt td,.smt th{padding-left:12px;padding-right:12px}
.smt td small.sub{white-space:normal}
.icb{display:inline-grid;place-items:center;width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:8px;color:#4b566b;padding:0}
.rowgo{font-size:22px;color:#8a94a6;width:16px;text-align:center;line-height:1}
.icb:hover{background:var(--grey-soft)}.icb.del{color:var(--red)}
.rebar{display:flex;align-items:center;gap:12px;margin:18px 0 0;padding:12px 16px;border-radius:10px;cursor:pointer;background:linear-gradient(180deg,#f4efff,#ebe2ff);border:1px solid #d9c9fb;color:#5b2bb5;flex-wrap:wrap}
.rebar b{font-size:14px}.rebar .rec{background:#fff;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800}
.rebar .red{font-size:12px;background:#fff;color:#5b6679;border-radius:6px;padding:2px 8px;font-weight:600}
.rebar .rel{margin-left:auto;font-size:13px;font-weight:700}
.defbox{border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.defbox .def{background:#eef4ff;padding:10px 14px}.defbox .clo{background:#ecf9f0;padding:10px 14px}
.defbox b{font-size:12px;letter-spacing:.3px}.defbox .def b,.defbox .def p{color:#2550c8}.defbox .clo b,.defbox .clo p{color:#1c7a4a}
.defbox p{margin:4px 0 0;font-size:13px;line-height:1.5}
.rrows{display:flex;flex-direction:column;gap:10px;flex:none}
.rrow{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.rtop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 14px}
.rrow .rl{min-width:0;display:flex;flex-direction:column;gap:3px}
.rrow .rl b{font-size:15px;font-weight:700}.rrow .rl small{color:var(--muted);font-size:12px;line-height:1.4}
.rview{border:0;background:none;color:#4a3df0;font-size:13px;font-weight:700;white-space:nowrap;padding:2px 0;cursor:pointer}
.rview:hover{text-decoration:underline}
.rfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:9px 14px;background:#f8f9fc;border-top:1px solid var(--line-soft)}
.rst{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.rst .wgk{font-size:12px}
.rrow .ck{border-radius:50%;width:16px;height:16px}
.racts{display:flex;gap:8px;margin-left:auto}
.subt{display:flex;flex-wrap:wrap;gap:6px}
.st{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--amber-soft);color:var(--amber);white-space:nowrap}
.st.done{background:var(--green-soft);color:var(--green)}
.st.skip{background:var(--grey-soft);color:#5b6679}
.sumstrip{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#fff;margin-bottom:10px}
.sumstrip .n{font-size:22px;font-weight:800;line-height:1}
.sumstrip .lbl{font-size:13px;font-weight:600;color:#39445a}
.sumstrip .sb{font-size:12px;color:var(--muted)}
.sumstrip .sb b{color:var(--ink);font-size:14px}
.fchip.n{color:#5b6679}.fchip.n .cn{background:var(--grey-soft);color:#5b6679}
.att{font-size:11px;font-weight:700;color:var(--amber);background:var(--amber-soft);border-radius:999px;padding:1px 8px}
.wabtn,.callbtn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;white-space:nowrap;border:1px solid transparent;cursor:pointer}
.wabtn{background:#2f5a2a;border-color:#2f5a2a;color:#fff}
.callbtn{background:#2f3fbf;border-color:#2f3fbf;color:#fff}
.callbtn:disabled{background:#e0e2ea;border-color:#e0e2ea;color:#8b90a6;cursor:not-allowed}
.lbtn.sm{padding:6px 10px;font-size:12px;white-space:nowrap}
.lbtn:disabled{opacity:.45;cursor:not-allowed}
.newtag{background:#7c3aed;color:#fff;border-radius:4px;padding:1px 6px;font-size:9px;letter-spacing:.4px}
.boostcard.green{background:linear-gradient(180deg,#e8f7ee,#ddf3e6);border-color:#bfe6cf}
.boostcard .bhead{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.3px;color:#8a4a46}
.boostcard.green .bhead{color:#276745}
.boostcard .bnum{font-size:30px;font-weight:800;color:#c0342b;line-height:1}
.boostcard.green .bnum{color:#1c7a4a}
.boostcard .bsub{font-size:12px;color:#8a4a46}
.boostcard.green .bsub{color:#276745}
.boostcard .bdue{align-self:flex-start;background:rgba(255,255,255,.7);border-radius:5px;padding:2px 8px;font-size:11px;color:#8a4a46;font-weight:600}
.boostcard.green .bdue{color:#276745}
.boostcard .blink{margin-top:auto;font-size:12px;font-weight:700;color:#b42318}
.boostcard.green .blink{color:#1c7a4a}
.taskcard{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;background:#fff}
.taskcard .tchead b{font-size:14px;display:block}
.taskcard .tchead small{color:var(--muted);font-size:12px}
.taskcard .tcbadge{align-self:flex-start;background:var(--amber-soft);color:var(--amber);font-size:11px;font-weight:700;padding:3px 10px;border-radius:6px}
.htc{background:var(--grey-soft);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.htc .htclabel{font-size:10px;font-weight:800;letter-spacing:.5px;color:var(--muted);text-transform:uppercase}
.htc .htcchip{align-self:flex-start;background:var(--blue-soft);color:var(--blue);font-size:11px;font-weight:700;padding:3px 10px;border-radius:6px}
.htc p{margin:0;font-size:12px;color:#39445a;line-height:1.5}
.taskcard .tcbtns{display:flex;gap:8px}
.taskcard .tcbadges{display:flex;gap:6px;flex-wrap:wrap}
.taskcard .tcbadge.re{background:var(--blue-soft);color:var(--blue)}
.dchips{display:flex;gap:6px}
.dchips .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;color:#39445a}
.dchips .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:#39445a}
input[type=date],select.in,textarea{border:1px solid #c8d1de;border-radius:6px;padding:8px 10px;font:inherit;color:var(--ink);background:#fff;max-width:100%}
textarea{min-height:80px;resize:vertical;width:100%}
.err{color:var(--red);font-size:12px;font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid #c8d1de;background:#fff;border-radius:6px;padding:8px 14px;font-weight:600;font-size:13px;color:var(--ink)}
.btn:hover{background:#f6f8fb}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.p:hover{background:#2449d4}
.btn.d{background:#fff;border-color:#f1b5b5;color:var(--red)}
.btn.d:hover{background:var(--red-soft)}
.btn.g{background:var(--green);border-color:var(--green);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12px}

.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.b-amber{background:var(--amber-soft);color:var(--amber)}
.b-blue{background:var(--blue-soft);color:var(--blue)}
.b-green{background:var(--green-soft);color:var(--green)}
.b-red{background:var(--red-soft);color:var(--red)}
.b-grey{background:var(--grey-soft);color:#5b6679}


.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:#f6f8fb;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#4b566b;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th.s{cursor:pointer}
td{padding:9px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.cl{cursor:pointer}tr.cl:hover td{background:#f8faff}
tr.sel td{background:#f2f6ff}
.un{color:var(--amber);font-weight:600}
.pag{display:flex;gap:8px;align-items:center;justify-content:flex-end;font-size:12px;color:var(--muted);padding:8px 0}

.page{display:flex;flex-direction:column;gap:14px}
.back{background:none;border:0;color:var(--blue);font-weight:600;padding:0;align-self:flex-start}
.ph{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between}
.ph h1{margin:0;font-size:20px;text-wrap:balance}
.ph p{margin:2px 0 0;color:var(--muted);font-size:13px}
.prog{min-width:220px}
.bar{height:8px;background:var(--line-soft);border-radius:5px;overflow:hidden;margin-top:5px}
.bar span{display:block;height:100%;background:var(--blue)}
.fbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
/* Every filter control is the same height and width so the row reads as one set. */
.fbar select.in,.fbar .stagepick>.btn{height:36px;width:170px;padding:0 10px;font-size:13px;font-weight:400;border:1px solid #c8d1de;border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:space-between;color:var(--ink)}
.fbar .stagepick>.btn .chv{flex:none;margin-left:8px;color:#39445a}
.fbar .stagepick>.btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbar .seg{height:36px}
.fbar .seg button{height:34px;padding:0 14px;font-size:13px}
.seg{display:inline-flex;border:1px solid #c8d1de;border-radius:6px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 12px;font-size:12px;font-weight:600;color:#39445a}
.seg button.on{background:var(--blue);color:#fff}
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--nav);color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;z-index:20;box-shadow:0 -6px 20px rgba(0,0,0,.2)}
.bottom select{min-width:240px}

.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meta div small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.meta div b{font-size:14px}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{padding:8px 0 8px 16px;border-left:2px solid var(--line);position:relative;font-size:13px}
.hist li:before{content:"";position:absolute;left:-5px;top:13px;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.hist li small{color:var(--faint);display:block;font-size:11px}

.modal{position:fixed;inset:0;background:rgba(11,18,32,.5);display:grid;place-items:center;padding:16px;z-index:60}
.mbox{background:#fff;border-radius:10px;max-width:460px;width:100%;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.mbox h3{margin:0;font-size:17px}
.mbox.wide{max-width:860px}
.mbox{max-height:calc(100vh - 32px);overflow:auto}
.mbox>.tw,.mbox>.llist{flex:1 1 auto;min-height:0;overflow:auto}

function groupCounts(leads){
  var g={}; GROUP_ORDER.forEach(function(k){ g[k]={total:0,stages:{}}; });
  leads.forEach(function(l){
    var grp=leadGroup(l);
    g[grp].total++;
    g[grp].stages[l.stage]=(g[grp].stages[l.stage]||0)+1;
  });
  return g;
}

function msgCounts(ch){

  var c={Sent:0,Failed:0,Pending:0}; Object.keys(m).forEach(function(k){ c[m[k][ch].s]++; }); return c;

/* SM list: one row per leaver (latest request). Live leavers come from S.lv; Farhan and Dev are
   static sample history. Deactivated leavers drop off the list, so it stays short without a date
   filter. Order: Pending (nearest LWD first), Rejected, Approved, Transferred, then Cancelled. */
var SAMPLE_ROWS=[
  {name:"Farhan Ali",tl:"Meera Iyer",lwd:new Date(2026,8,30),leads:288,status:"deactivated",tApp:"16 Sep 2026"},
  {name:"Dev Khanna",tl:"Meera Iyer",lwd:new Date(2026,9,20),leads:302,status:"cancelled",tApp:"18 Sep 2026"}
];
var SORT_RANK={pending:1,approved:2,transferred:3,deactivated:4,cancelled:5};
/* One row per request the SM has to deal with: requests waiting for approval, leads being reassigned, and handovers being tracked. Past holds finished and
   deleted ones. */
function smRows(){
  var rows=[], past=S.smTab==="past";
  Object.keys(S.lv).forEach(function(id){ var r=S.lv[id].req; if(!r) return; if(past !== (r.status==="deactivated"||r.status==="cancelled")) return;
    var lv=S.lv[id];
    rows.push({id:id,name:PEOPLE[id].name,tl:TLof(id).name,lwd:r.lwd,leads:lv.leads.length,status:r.status,tApp:r.tApp,moved:Object.keys(lv.assign).length,joined:Object.keys(r.joined).filter(function(k){return lv.assign[k];}).length}); });
  SAMPLE_ROWS.forEach(function(x){ if(past) rows.push(x); });
  rows.sort(function(a,b){ return (SORT_RANK[a.status]-SORT_RANK[b.status]) || (past ? b.lwd-a.lwd : (a.lwd||0)-(b.lwd||0)); });
  return rows;
}

var IC_DEL='<svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M5 4.5l.6 8.5h4.8l.6-8.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
/* Row actions follow the request: raise it, approve it, or change the date (calendar). Delete is only
   offered while no lead has moved, because a reassignment can't be undone. */
function smAction(r){
  var tools="";
  if(r.id){
    if(r.status==="pending") tools+='<button class="btn sm p" data-review="'+r.id+'">Approve</button>';
    if(["pending","approved"].indexOf(r.status)!==-1) tools+='<button class="icb" data-editlwd="'+r.id+'" title="Change last working day" aria-label="Change last working day">'+IC_CAL+'</button>';
    if((r.status==="pending"||r.status==="approved") && !movedCount(r.id)) tools+='<button class="icb del" data-cancelreq="'+r.id+'" title="Delete last working day" aria-label="Delete last working day">'+IC_DEL+'</button>';
  }
  return '<div class="row" style="gap:6px;flex-wrap:nowrap;justify-content:flex-end;margin:0">'+tools+'<span class="rowgo" aria-hidden="true">&rsaquo;</span></div>';
}

/* One status badge and one supporting line per row, so the list scans quickly. */
function smStatus(r){
  if(r.status==="pending") return statusBadge("pending")+'<small class="sub">Raised · waiting for your approval</small>';
  if(r.status==="approved"){ var x=r.id?slaInfo(r.id):{}, blocked=r.id&&S.lv[r.id].req.blocked;
    return (blocked?'<span class="badge b-red" title="Last working day passed with unassigned leads, so the login could not be deactivated">Deactivation blocked</span>'
      :x.overdue?'<span class="badge b-red" title="TL/PL missed the 24-hour deadline; '+esc(escalees(x))+' were emailed">Overdue</span>':statusBadge(r.status))+
      '<small class="sub"><span class="num">'+r.moved+' / '+r.leads+'</span> reassigned</small>'; }
  if(r.status==="transferred") return statusBadge(r.status)+'<small class="sub"><span class="num">'+r.joined+' / '+r.leads+'</span> groups joined</small>';
  return statusBadge(r.status);

/* ---------- after leads move: handover tracking (SM, TL, POD) ----------

   Track handover) and the TL / POD leader (Reassign Leads, the leaver's card) can see where the leads
   went and how many new counsellors have joined each student's WhatsApp group. On each join the old
   counsellor and old RM are removed from the group (the TL too, if the lead moved to another TL's team),

/* WhatsApp group membership, shown like the production lead page: a checkbox per member. The student is

function wgChecks(clLabel,clIn,rmIn){
  function ck(on,label){ return '<span class="wgk"><span class="ck'+(on?" on":"")+'">'+(on?"&#10003;":"")+'</span>'+label+'</span>'; }
  return '<span class="wg">'+ck(clIn,clLabel)+ck(true,"Student")+'</span>';

function lgcByOwner(){
  var by={};
  S.leads.forEach(function(l){ var k=S.assign[l.id]; if(!k) return; var o=by[k]=by[k]||{n:0,j:0,rj:0,ng:0,leads:[]}; o.n++; o.leads.push(l);
    if(S.req.joined&&S.req.joined[l.id]) o.j++; if(S.req.rmJoined&&S.req.rmJoined[l.id]) o.rj++; if(S.req.noGroup&&S.req.noGroup[l.id]) o.ng++; });
  return by;
}

/* ---------- Reassign leads (TL, POD leader or SM) ---------- */
/* Who can receive leads: active counsellors under the same SM, excluding the leaver, anyone who has
   leaving, and anyone with a live request of their own. */
function eligible(){ return Object.keys(PEOPLE).map(function(k){return PEOPLE[k];}).filter(function(p){
  var r=S.lv[p.id]&&S.lv[p.id].req;
  return p.role==="Counselor" && p.sm==="vikram" && p.id!==LV().id && !p.leaves && !(r && r.status!=="cancelled"); }); }
function svcLabel(x){ return x==="PAID_SERVICE"?"Paid":"Free"; }
function progLabel(x){ return x==="MASTERS"?"PG":"UG"; }
/* Group stage runs on the server, so it narrows the whole book. The list then loads 500 at a time and
   Servicing type / Program / Show only filter the leads already loaded (they run locally on the page). */
function serverLeads(){
  var t=S.tl;
  return S.leads.filter(function(l){
    if(t.grp.length&&t.grp.indexOf(leadGroup(l))===-1) return false;
    return true; });
}
function loadedCount(){ return Math.min(S.tl.loaded,serverLeads().length,LEAD_CAP); }
function sortVal(l,k){
  if(k==="to") return S.assign[l.id]?PEOPLE[S.assign[l.id]].name:"~";
  if(k==="intake"||k==="country") return leadMeta(l)[k];
  if(k==="lockin") return lockInOf(l)||"~";
  if(k==="uid") return l.id;
  if(k==="stage") return STAGES.indexOf(l.stage);
  if(k==="name") return l.name;
  return l[k];
}
function filtered(){
  var t=S.tl;
  var rows=serverLeads().slice(0,loadedCount()).filter(function(l){
    var lm=leadMeta(l);
    if(t.servicing.length&&t.servicing.indexOf(l.servicing)===-1) return false;
    if(t.lockin.length&&t.lockin.indexOf(lockInOf(l)||"NONE")===-1) return false;
    if(t.score.length&&t.score.indexOf(scoreOf(l))===-1) return false;
    if(t.intake.length&&t.intake.indexOf(lm.intake)===-1) return false;
    if(t.country.length&&t.country.indexOf(lm.country)===-1) return false;
    if(t.program!=="All"&&l.program!==t.program) return false;
    if(t.show==="Unassigned"&&S.assign[l.id]) return false;
    if(t.show==="Assigned"&&!S.assign[l.id]) return false;
    return true; });
  var k=t.sort, d=t.dir;
  rows.sort(function(a,b){ var x=sortVal(a,k), y=sortVal(b,k); return x<y?-d:x>y?d:0; });
  return rows;
}

/* ---------- Tasks & Performance (visual style borrowed from the counselor CRM's own Tasks &
   Performance tab — its "Add a Reminder for Yourself" section — but not rebuilt here; this mockup
   only adds the one new task type, as static/derived display with no save, close or reminder
   logic behind it, since none of that exists to hook into yet). ---------- */
/* Per-task cards styled after the counselor CRM's own "Boost STI" pipeline drawer (student header,
   a task-type badge, a "How to close" explainer, View student/View Task actions) rather than the
   plain table this used to be. */
/* Reassigned leads in one Boost bucket ("sti" or "deposit") for the person currently viewing (Rahul
   sees his own; Ankit sees his whole team's, for oversight). These carry the Connect with Reassigned
   Leads task and show inside the existing Boost STI / Boost Deposit drawers with a Reassigned badge. */
/* Connect with Reassigned Leads: ONE handover task per reassigned lead, for the viewer (Rahul: his own;
   TL / POD / SM: their teams'). Two sub-tasks:
   1. Join the student's WhatsApp group — every lead. If the student has no group, nothing is sent and the
      counsellor introduces themselves directly (nothing to join).
   2. Call the student — post-STI leads excluding visa approved (STI, Deposit Done, Visa until approved) and
      every locked-in (Paid-service) student, in any stage.
      Closes on a connected call (over 10 seconds) or after 3 unanswered attempts (each ringing 30s or
      more). There is no way to close it without a call attempt. After the unanswered attempts the student
      also gets an email and an LGC notification as fallback.
   The task is done when sub-task 1 is done and, where it applies, sub-task 2 is closed. Call order is the
   bucket order below: deposit done, STI done, visa in process. */
var RE_CHIPS=[["dep","Deposit done","g"],["lock","Premium / lock-in","y"],["sti","STI done","b"],["pre","STI not done","a"],["visa","Visa in process","r"],["vdone","Visa approved","p"],["drop","Dropped off","n"]];
var VISA_WIP=["LS_VISA_FILING_STARTED","LS_VISA_WIP","LS_VISA_APPLIED","LS_VISA_PROCESS_ON_HOLD"];
function reChipOf(l){ var g=leadGroup(l);
  if(g==="deposit_done") return "dep";
  if(lockInOf(l)) return "lock";
  if(g==="sti") return "sti";
  if(g==="visa") return VISA_WIP.indexOf(l.stage)!==-1 ? "visa" : "vdone";
  if(g==="pre_sti") return "pre";
  return "drop"; }
function reRank(l){ for(var i=0;i<RE_CHIPS.length;i++) if(RE_CHIPS[i][0]===reChipOf(l)) return i; return 9; }
/* Post-STI leads excluding visa approved, and every locked-in student (whatever their stage). */
function callEligible(l){ var c=reChipOf(l); return c==="dep"||c==="lock"||c==="sti"||c==="visa"; }
function isJoined(l){ var r=S.lv[l._lv].req; return !!(r.joined&&r.joined[l.id]); }
function hasNoGroup(l){ var r=S.lv[l._lv].req; return !!(r.noGroup&&r.noGroup[l.id]); }
/* Mock call log, seeded from the lead ID for leads already in the group. */
function callRec(l){
  if(!S.calls[l.id]){ var n=parseInt(l.id.replace(/\D/g,""),10), j=isJoined(l);
    S.calls[l.id]={tries: j&&n%5===1?2:0, connected: j&&n%5===0}; }
  return S.calls[l.id];
}
function taskClosed(l){ var c=callRec(l); return isJoined(l) && (!callEligible(l) || c.connected || c.tries>=3); }
/* Every lead reassigned to the viewer (or to their team, for TL / POD / SM), with its leaver in _lv. */
function reassignedFor(){
  var v=S.view, oversight = v==="ankit"||v==="vikram"||v==="rohit", out=[];
  Object.keys(S.lv).forEach(function(id){ var lv=S.lv[id], r=lv.req; if(!r||r.status==="cancelled") return;
    lv.leads.forEach(function(l){
      var owner=lv.assign[l.id];
      if(!owner || !(r.movedNow&&r.movedNow[l.id])) return;
      if(oversight ? !(v==="vikram" || (v==="rohit" ? podOf(owner)==="rohit" : PEOPLE[owner].tl===v)) : owner!==v) return;
      l._lv=id; out.push(l);
    });
  });
  return out;
}
function drawerLeads(scope){
  if(scope!=="re") return [];
  return reassignedFor().filter(function(l){ return !taskClosed(l); }).sort(function(a,b){ return reRank(a)-reRank(b) || (a.name<b.name?-1:1); });
}
function reChipHit(l,chip){ return chip==="all" || reChipOf(l)===chip; }

/* One compact row per student: name, ID, bucket and country · intake, the group's CL / Student ticks,
   the two sub-tasks with their state, then the CTAs. Call Student stays off until sub-task 1 is done.

function reRowHtml(l){ return withLeaver(l._lv,function(){
  var j=isJoined(l), c=callRec(l), own=S.view===S.assign[l.id], key=l._lv+'|'+l.id, ng=hasNoGroup(l), ce=callEligible(l);
  var rj=!!(S.req.rmJoined&&S.req.rmJoined[l.id]), lm=leadMeta(l);
  var meta=l.id.replace("LD-","")+' · '+lm.country+' · '+lm.intake+' · '+(isOversight()?esc(LV().name)+' &rarr; '+esc(PEOPLE[S.assign[l.id]].name):'From '+esc(LV().name));

  var s2 = ce ? ''
    : '<span class="st skip">Call · not needed ('+({pre:"STI not done",vdone:"visa approved",drop:"dropped off"}[reChipOf(l)])+')</span>';
  var status=(ng?"":wgChecks(own?"You":"CL",j,rj))+'<span class="subt">'+s1+s2+'</span>';

     (the two primary actions) on the right. */

  var prim;
  if(own){
    prim=(ng?'':(j?'<button class="wabtn" data-viewtask="'+l.id+'">'+IC_WA+'Open group</button>':'<button class="wabtn" data-joinlgc="'+key+'">'+IC_WA+'Join group</button>'))+
      (ce?'<button class="callbtn" data-callstu="'+key+'"'+(j?'':' disabled title="Join the group first"')+'>Call student</button>':'');
  } else {
    prim=(ng?'':(S.observe[S.view+"|"+l.id]?'<button class="wabtn" data-viewtask="'+l.id+'">'+IC_WA+'Open group</button>':'<button class="wabtn" data-observe="'+l.id+'">'+IC_WA+'Join group</button>'));
  }

}); }
/* Mock outcomes, so the joining and closing rules can be tried in the mockup. On join the old counsellor
   and old RM leave the group (the TL too when the lead moved to another TL's team), and the student gets
   the LGC message (pre- or post-application copy) and an email (CC old + new counsellor; BCC TL, SM). */
function preAppCopy(l){ return PRE_APP.indexOf(l.stage)!==-1; }
function joinLgc(lv,id){
  var msg="";
  withLeaver(lv,function(){
    var l=S.leads.filter(function(x){return x.id===id;})[0], old=LV(), nw=PEOPLE[S.assign[id]], tlOut=!!old.tl && nw.tl!==old.tl, copy=preAppCopy(l)?"Pre-application":"Post-application";
    S.req.joined[id]=1;
    hist(nw.name+" joined "+id+"'s WhatsApp group. "+old.name+" and old RM "+RM_NAMES[old.rm]+" removed"+(tlOut?"; "+TLof(lv).name+" removed (lead moved to another TL's team)":"")+". "+copy+" LGC message posted in the group; email sent (CC "+old.name+", "+nw.name+"; BCC TL, SM)",me().name);
    msg=copy+" LGC message and email sent to the student. "+old.name+" and the old RM were removed from the group";
  });
  render(); toast("Joined the group. "+msg);
}
function callStudent(lv,id){
  var l=S.lv[lv].leads.filter(function(x){return x.id===id;})[0]; l._lv=lv;
  showModal('<h3>Calling '+esc(l.name)+' on Jerry</h3><p style="font-size:13px;color:var(--muted);margin:0">Mockup: pick how the call went.</p><div class="row" style="flex-direction:column;align-items:stretch;gap:8px">'+
    '<button class="btn" data-co="ok">Connected, talked for over 10 seconds</button><button class="btn" data-co="ring">Rang 30s or more, not picked up (counts as an attempt)</button><button class="btn" data-co="short">Rang under 30s (doesn\'t count)</button></div><div class="row" style="justify-content:flex-end"><button class="btn" data-m="close">Cancel</button></div>');
  document.querySelectorAll("[data-co]").forEach(function(b){ b.onclick=function(){ var c=callRec(l), k=b.dataset.co;
    if(k==="ok") c.connected=true; else if(k==="ring") c.tries++;
    var fallback = k==="ring" && !c.connected && c.tries>=3;
    if(k==="ok") withLeaver(lv,function(){ hist("Call connected to "+id+"; handover task closed",me().name); });
    if(fallback) withLeaver(lv,function(){ hist("3 unanswered call attempts to "+id+"; handover task closed. Email and LGC notification sent to the student as fallback",me().name); });
    closeModal(); render();
    toast(taskClosed(l) ? (c.connected?"Call connected. Task closed":"3 attempts made. Task closed; email and LGC notification sent to the student") : k==="ring" ? "Attempt "+c.tries+" of 3 logged" : "Under 30s, not counted as an attempt"); }; });
}
/* View Task: the production lead page (Back, name, Templates / WhatsApp, details card). The WhatsApp
   groups row carries the membership checkboxes; for a reassigned lead the counsellor's box stays empty
   until they join the group (Step 0). */
var INTAKES=["Jan 2027","Sep 2026","May 2027"];
/* Lock-in details (IELTS / PTE / DET / Prime / Premium) exist only for Paid-service students. Lead score is
   HOT / COLD. Both are derived from the lead ID so the mock data stays stable. */
var LOCKINS=["IELTS","PTE","DET","Prime","Premium"];
function leadNum(l){ return parseInt(l.id.replace(/\D/g,""),10); }
function lockInOf(l){ return l.servicing==="PAID_SERVICE" ? LOCKINS[leadNum(l)%LOCKINS.length] : ""; }
function scoreOf(l){ return (leadNum(l)>>1)%2 ? "COLD" : "HOT"; }
function leadMeta(l){ var n=leadNum(l); return {country:COUNTRIES[n%COUNTRIES.length], intake:INTAKES[n%INTAKES.length]}; }
var COURSES=["Business Administration","Data Science","Computer Science","Finance","Mechanical Engineering","Marketing"], COUNTRIES=["Ireland","UK","USA","Canada","Germany"];
function findTaskLead(id){
  var hit=null;
  Object.keys(S.lv).forEach(function(k){ S.lv[k].leads.forEach(function(l){ if(l.id===id) hit={l:l,lv:k,owner:S.lv[k].assign[l.id],joined:!!(S.lv[k].req&&S.lv[k].req.joined[l.id])}; }); });
  if(hit) return hit;
  var r=OWN_BOOST.sti.concat(OWN_BOOST.deposit).filter(function(x){return x[1]===id;})[0];
  var parts=r[3].split(" · ");
  return {l:{id:id,name:r[0],program:"LS_MASTERS",servicing:"PAID_SERVICE",last:addDays(TODAY,-2),next:addDays(TODAY,3)},course:parts[1],country:parts[2],owner:r[2],joined:true,own:true};
}

    '<div class="vtcard"><div class="vtgrid">'+
      '<div><small>User ID</small><b>'+n+'</b></div><div><small>Course</small><b>'+esc(course)+'</b></div>'+
      '<div><small>Country</small><b class="lnk">'+esc(country)+'</b></div><div><small>Last call</small><b>'+stamp(l.last)+' — Connected</b></div>'+
      '<div><small>Follow-up</small><b>&#9998; '+(l.next?fmt(l.next):"--")+'</b></div><div><small>Last connected</small><b>'+stamp(l.last)+'</b></div>'+
      '<div><small>Intake</small><b>'+(t.own?"Jan 2027":leadMeta(l).intake)+'</b></div><div><small>Phone</small><button class="vtbtn">View Phone Number</button></div>'+
      '<div><small>Notes</small><button class="vtbtn">Fetch Notes</button></div><div></div></div>'+

      '<small class="vtlab">Servicing type</small><label class="f"><span>Type <span style="color:var(--red)">*</span></span><select class="in"><option'+(l.servicing==="FREE_SERVICE"?" selected":"")+'>Free Service</option><option'+(l.servicing==="PAID_SERVICE"?" selected":"")+'>Paid Service</option></select></label><div><button class="vtsave">Save</button></div>'+
    '</div></div>';
  document.getElementById("vtBack").onclick=closeModal2;
  el.querySelectorAll(".vttpl,.vtwa,.vtbtn,.vtsave,.vtprem").forEach(function(b){ b.onclick=function(){ toast("Not modeled in this mockup"); }; });
}
function openTaskDrawer(scope){ S.drawerOpen={scope:scope,search:"",chip:"all",today:false}; render(); }

/* Drawer laid out like the production Boost drawer: CL filter, Today's Tasks Only, category chips
   (with a Reassigned chip in the same style), search, then All Tasks. Reassigned leads only show here,
   never on the Boost card itself. */
function renderTaskDrawer(){
  var d=S.drawerOpen; if(!d) return "";
  var q=(d.search||"").trim().toLowerCase();
  function hit(name,id){ return !q || name.toLowerCase().indexOf(q)!==-1 || id.toLowerCase().indexOf(q)!==-1; }
  var chips, list, total, due, strip="";
  if(d.scope==="re"){
    var re=drawerLeads("re");
    var shown=re.filter(function(l){ return reChipHit(l,d.chip) && hit(l.name,l.id); });
    var all=reassignedFor(), b=bands(all);
    total=shown.length; due=re.filter(function(l){return !callRec(l).tries;}).length;
    /* What arrived: total plus the pre-STI / post-STI / visa-stage split. */
    strip='<div class="sumstrip"><span class="n num">'+all.length+'</span><span class="lbl">reassigned to '+(isOversight()?"your team":"you")+'</span>'+
      b.filter(function(x){return x[1]>0;}).map(function(x){ return '<span class="sb"><b class="num">'+x[1]+'</b> '+x[0]+'</span>'; }).join("")+'</div>';
    chips='<button class="fchip dark'+(d.chip==="all"?" on":"")+'" data-chip="all">All <span class="cn">'+re.length+'</span></button>'+
      RE_CHIPS.map(function(c){ return '<button class="fchip '+c[2]+(d.chip===c[0]?" on":"")+'" data-chip="'+c[0]+'">'+c[1]+' <span class="cn">'+re.filter(function(l){return reChipHit(l,c[0]);}).length+'</span></button>'; }).join("");
    list = '<div class="defbox"><div class="def"><b>&#8505;&#65039; DEFINITION</b><p>'+(isOversight()?"Students are reassigned from a counsellor who is leaving. Track your team's counsellors completing the tasks.":"Students are reassigned from a counsellor who is leaving. Complete the tasks.")+'</p></div>'+
      '<div class="clo"><b>&#9989; TASK CLOSURE</b><p>Join LGC and speak to the student to close the task.</p></div></div>'+
      (total ? '<div class="rrows">'+shown.map(reRowHtml).join("")+'</div>' : '<div class="note">'+(re.length?"No students match.":"No open handover tasks.")+'</div>');
  } else {
    var own=ownBoostRows(d.scope), ownShown=own.filter(function(r){return hit(r[0],r[1]);});
    total=ownShown.length; due=d.scope==="sti"?10:4;
    chips='<button class="fchip dark'+(d.chip==="all"?" on":"")+'" data-chip="all">All <span class="cn">'+own.length+'</span></button>'+
      DRAWER_CHIPS[d.scope].map(function(c){ return '<button class="fchip '+c[3]+(d.chip===c[0]?" on":"")+'" data-chip="'+c[0]+'">'+c[1]+' <span class="cn">'+c[2]+'</span></button>'; }).join("");
    list = total ? ownShown.map(ownCardHtml).join("") : '<div class="note">No students match.</div>';
  }
  return '<div class="drawerbg" id="drawerBg"></div>'+
    '<div class="drawer" role="dialog" aria-modal="true"><div class="dhead"><button id="drawerBack" aria-label="Back">&larr;</button><b>'+esc(drawerTitle(d.scope))+'</b><button id="drawerRefresh" aria-label="Refresh">&#8635;</button><button id="drawerClose" aria-label="Close">&times;</button></div>'+
    '<div class="dtop">'+strip+(isOversight()?'<span class="clsel">&#128101; CL: All &#8964;</span>':'')+
      '<div class="row" style="gap:10px"><button class="todaybtn'+(d.today?" on":"")+'" id="todayBtn">&#128197; Today\'s Tasks Only</button><span class="dsub">'+due+' students due today</span></div>'+
      '<div class="fchips">'+chips+'</div>'+
      '<input class="dsearch" id="drawerSearch" placeholder="Search by name or ID..." value="'+esc(d.search||"")+'"></div>'+
    '<div class="dbody"><div class="allhead"><span>&#128275; All Tasks</span><span class="n">'+total+' total</span></div>'+list+'</div></div>';
}
function bindTaskDrawer(){
  var d=S.drawerOpen; if(!d) return;
  function close(){ S.drawerOpen=null; render(); }
  var bg=document.getElementById("drawerBg"); if(bg) bg.onclick=close;
  var back=document.getElementById("drawerBack"); if(back) back.onclick=close;
  var x=document.getElementById("drawerClose"); if(x) x.onclick=close;
  var rf=document.getElementById("drawerRefresh"); if(rf) rf.onclick=function(){ toast("Refreshed"); };
  var tb=document.getElementById("todayBtn"); if(tb) tb.onclick=function(){ d.today=!d.today; render(); };
  var s=document.getElementById("drawerSearch");
  if(s){ s.oninput=function(){ d.search=s.value; render(); var ns=document.getElementById("drawerSearch"); if(ns){ ns.focus(); ns.setSelectionRange(ns.value.length,ns.value.length); } }; }
  document.querySelectorAll("[data-chip]").forEach(function(b){ b.onclick=function(){ d.chip=b.dataset.chip; render(); }; });
  document.querySelectorAll("[data-viewstudent]").forEach(function(b){ b.onclick=function(){ toast("Not modeled in this mockup"); }; });
  document.querySelectorAll("[data-joinlgc]").forEach(function(b){ b.onclick=function(){ var x=b.dataset.joinlgc.split("|"); joinLgc(x[0],x[1]); }; });
  document.querySelectorAll("[data-observe]").forEach(function(b){ b.onclick=function(){ S.observe[S.view+"|"+b.dataset.observe]=1; render(); toast("Joined the group to follow along. The CL still needs to join and call"); }; });
  document.querySelectorAll("[data-callstu]").forEach(function(b){ b.onclick=function(){ var x=b.dataset.callstu.split("|"); callStudent(x[0],x[1]); }; });
  document.querySelectorAll("[data-viewtask]").forEach(function(b){ b.onclick=function(){ viewTaskPage(b.dataset.viewtask); }; });
}

   cards. Only while there are open tasks; otherwise the page is the existing CRM view. */

/* ---------- Status changes and the last working day ---------- */
/* Called after every assignment. Once every lead has an owner the request becomes "Leads reassigned" and
   the SM and TL are told. If the last working day already passed and the login was blocked on unassigned
   leads, it deactivates the moment the last lead is reassigned. */
function syncStatus(id){
  var lv=S.lv[id], r=lv.req;
  if(r.status!=="approved" || Object.keys(lv.assign).length<lv.leads.length) return;
  r.status="transferred"; r.tTr=now();
  withLeaver(id,function(){ hist("All "+lv.leads.length+" leads reassigned","System"); });
  [TLof(id).id,"vikram"].forEach(function(w){
    notify(w,PEOPLE[id].name+"'s "+lv.leads.length+" leads are all reassigned. Track the new counsellors joining the students' WhatsApp groups.",
      w==="vikram"?{label:"Track handover",route:"home",tab:"tasks",tm:"lwd",tmView:id}:{label:"Track handover",route:"home",tab:"tasks",tm:"sched",focus:id}); });
  if(r.blocked) deactivate(id);
}
/* How many reassigned students still have no new counsellor in the group, and how many call tasks are open. */
function handoverPending(id){ var lv=S.lv[id], nj=0, nc=0;
  lv.leads.forEach(function(l){ if(!lv.assign[l.id]) return; l._lv=id;
    if(!isJoined(l)) nj++;
    var c=callRec(l); if(callEligible(l) && !(c.connected||c.tries>=3)) nc++; });
  return {nj:nj, nc:nc}; }
/* Login deactivated. The old counsellor already left each group when its new counsellor joined; they stay
   only in groups where nobody joined, as the fallback. If the last working day has passed and a new
   counsellor has not joined a group or called, Debasish Sahoo, the SM and the reporting manager are emailed. */
function deactivate(id){
  var lv=S.lv[id], r=lv.req, p=PEOPLE[id], n=lv.leads.length, j=Object.keys(r.joined).length, never=n-j, hp=handoverPending(id);
  r.status="deactivated"; r.blocked=false;
  var chase = (hp.nj||hp.nc) ? "Email sent to Debasish Sahoo, the SM and "+TLof(id).name+": "+hp.nj+" new counsellors have not joined the group and "+hp.nc+" call tasks are still open" : "";
  withLeaver(id,function(){ hist(p.name+"'s CRM login deactivated"+(never?". "+never+" students never got their new counsellor in the group, so "+p.name+" stays in those groups as fallback":""),"System");
    if(chase) hist(chase,"System"); });
  [TLof(id).id,"vikram"].forEach(function(w){ notify(w,p.name+"'s last working day is done: login deactivated"+(chase?". Alert email sent to Debasish Sahoo, the SM and "+TLof(id).name+": "+hp.nj+" new counsellors have not joined and "+hp.nc+" calls are still open.":"."),
    w==="vikram"?{label:"View",route:"home",tab:"tasks",tm:"lwd",tmView:id}:{label:"View",route:"home",tab:"tasks",tm:"sched",focus:id}); });
}
/* Mock: every new counsellor of Priya's leads joins their students' groups. The old counsellor and old RM
   are removed on each join; the student gets the LGC message and email. */
function joinAll(){
  var lv=S.lv.priya, r=lv.req; if(!r) return;
  S.clock=fmt(addDays(parseStamp(S.clock)||TODAY,1))+", 8:00 PM";
  var n=0;
  lv.leads.forEach(function(l){ if(lv.assign[l.id] && !r.joined[l.id]){ r.joined[l.id]=1; n++; } if(lv.assign[l.id]) r.rmJoined[l.id]=1; });
  withLeaver("priya",function(){ hist(n+" new counsellors joined their students' WhatsApp groups; "+PEOPLE.priya.name+" and the old RM removed on each join; LGC message and email sent to each student","System"); });
  render(); toast("Everyone joined their WhatsApp groups");
}
/* 11 PM on the day before the last working day: if reassignment is still pending, or a new counsellor has
   joined none of their groups, an alert email goes to Debasish Sahoo, the SM and the reporting manager.
   If the last working day is tomorrow it fires the same day. */
function lwdAlert(){
  var lv=S.lv.priya, r=lv.req; if(!r) return;
  S.clock=fmt(addDays(r.lwd,-1))+", 11:00 PM";
  var left=lv.leads.length-Object.keys(lv.assign).length;
  var by={};
  lv.leads.forEach(function(l){ var o=lv.assign[l.id]; if(!o||r.noGroup[l.id]) return; var x=by[o]=by[o]||{n:0,j:0}; x.n++; if(r.joined[l.id]) x.j++; });
  var idle=Object.keys(by).filter(function(k){ return by[k].j===0; });
  var parts=[];
  if(left>0) parts.push(left+" of "+PEOPLE.priya.name+"'s leads are still not reassigned");
  if(idle.length) parts.push(idle.map(function(k){ return PEOPLE[k].name+" ("+by[k].n+" groups)"; }).join(", ")+" "+(idle.length>1?"have":"has")+" joined none of their groups");
  if(!parts.length){ render(); toast("No alert: everything is reassigned and every new counsellor has joined a group"); return; }
  var text=parts.join(". ")+".", tl=TLof("priya");
  r.alerted=fmtStamp(parseStamp(S.clock)); r.alertText=text;
  withLeaver("priya",function(){ hist("11 PM, one day before the last working day: alert email sent to Debasish Sahoo, the SM and "+tl.name+". "+text,"System"); });
  [tl.id,"vikram"].forEach(function(w){ notify(w,"Alert email: "+text+" "+PEOPLE.priya.name+" leaves tomorrow at 8 PM.",
    w==="vikram"?{label:"Track handover",route:"home",tab:"tasks",tm:"lwd",tmView:"priya"}:{label:"Reassign leads",route:"home",tab:"tasks",tm:"sched",focus:"priya"}); });
  render(); toast("Alert email sent to Debasish Sahoo, the SM and "+tl.name);
}
/* 8 PM on the last working day. If every lead has been reassigned the login is deactivated; if not it
   stays active (the long-standing system rule) and the SM and TL are alerted until the leads are placed. */
function jumpToLwd(){
  var lv=S.lv.priya, r=lv.req; if(!r||(r.status!=="approved"&&r.status!=="transferred")) return;
  S.clock=fmt(r.lwd)+", 8:00 PM";
  var left=lv.leads.length-Object.keys(lv.assign).length;
  if(left>0){
    r.blocked=true;
    withLeaver("priya",function(){ hist("Last working day, 8 PM: "+left+" leads are still unassigned, so the login can't be deactivated. Alert email sent to Debasish Sahoo, the SM and "+TLof("priya").name,"System"); });
    [TLof("priya").id,"vikram"].forEach(function(w){ notify(w,PEOPLE.priya.name+"'s last working day has passed with "+left+" leads still unassigned. The login stays active until they are reassigned.",
      w==="vikram"?{label:"Reassign leads",route:"home",tab:"tasks",tm:"sched",focus:"priya"}:{label:"Reassign leads",route:"home",tab:"tasks",tm:"sched",focus:"priya"}); });
    render(); toast("Deactivation blocked: "+left+" leads still unassigned"); return;
  }
  deactivate("priya"); render(); toast("Last working day: login deactivated");
}

/* ---------- View assigned leads (new counsellor) ----------
   The top-bar button already exists in the CRM. Reassigned leads, in every stage, are marked so the
   new counsellor can tell them apart and filter to them. */
var OWN_LEADS=[["Aarav Mehta","LD-31842","LS_APPLICATION_SUBMITTED_TO_INSTITUTE"],["Isha Kapoor","LD-31907","LS_CONDITIONAL_ADMIT_RECEIVED"],["Kabir Shah","LD-30766","LS_DEPOSIT_PAID"],["Tara Bose","LD-30655","LS_COLLEGE_SHORTLISTED"],["Dhruv Jain","LD-30588","LS_VISA_APPLIED"]];
function assignedPage(){
  var v=S.view, by={}, order=[];
  Object.keys(S.lv).forEach(function(id){ withLeaver(id,function(){ var r=S.req; if(!r) return;
    S.leads.forEach(function(l){ if(S.assign[l.id]===v && r.movedNow && r.movedNow[l.id]){
      if(!by[id]){ by[id]={id:id,leads:[]}; order.push(id); }
      by[id].leads.push({l:l,on:r.movedNow[l.id],joined:!!(r.joined&&r.joined[l.id]),ng:!!(r.noGroup&&r.noGroup[l.id]),rj:!!(r.rmJoined&&r.rmJoined[l.id])}); } }); }); });
  var a=S.assigned, all=[]; order.forEach(function(id){ by[id].leads.forEach(function(x){ all.push(x.l); }); });
  var b=bands(all);
  var dash='<span style="color:var(--faint)">—</span>';
  function wa(x){ return x.ng?'<span class="badge b-grey">No WhatsApp group</span><small class="sub">Introduce yourself directly</small>':wgChecks("You",x.joined)+(x.joined?'':'<small class="sub">Join to accept this lead</small>'); }
  var head='<thead><tr><th>Student</th><th>Lead stage</th><th>Servicing type</th><th>Lock in details</th><th>Intake</th><th>Country</th><th>UG / PG</th><th>WhatsApp group</th></tr></thead>';
  /* One block per old counsellor: old counsellor name, old TL name and number of leads, then the lot. */
  var lots = order.map(function(id){ var g=by[id], p=PEOPLE[id], tl=p.tl?PEOPLE[p.tl].name:"No TL";
    var rows=g.leads.map(function(x){ var l=x.l, lm=leadMeta(l);
      return '<tr><td><b>'+esc(l.name)+'</b><small class="sub">'+l.id+'</small></td><td>'+esc(STAGE_LABEL[l.stage])+'</td><td>'+svcLabel(l.servicing)+'</td><td>'+(lockInOf(l)||dash)+'</td><td>'+esc(lm.intake)+'</td><td>'+esc(lm.country)+'</td><td>'+progLabel(l.program)+'</td><td>'+wa(x)+'</td></tr>'; }).join("");
    return '<div class="card" style="padding:0"><div class="row" style="justify-content:space-between;padding:12px 14px;margin:0"><span><b>'+esc(p.name)+'</b> <small class="sub" style="display:inline">Old TL: '+esc(tl)+'</small></span><span class="badge b-blue"><span class="num">'+g.leads.length+'</span> leads</span></div>'+
      '<div class="tw"><table>'+head+'<tbody>'+rows+'</tbody></table></div></div>'; }).join("");
  var own = !a.onlyRe ? '<div class="card" style="padding:0"><div class="row" style="justify-content:space-between;padding:12px 14px;margin:0"><b>Your own leads</b><span class="badge b-grey"><span class="num">'+OWN_LEADS.length+'</span> leads</span></div><div class="tw"><table><thead><tr><th>Student</th><th>Lead stage</th></tr></thead><tbody>'+
    OWN_LEADS.map(function(o){ return '<tr><td><b>'+esc(o[0])+'</b><small class="sub">'+o[1]+'</small></td><td>'+esc(STAGE_LABEL[o[2]])+'</td></tr>'; }).join("")+'</tbody></table></div></div>' : '';
  var strip = all.length ? '<div class="sumstrip"><span class="n num">'+all.length+'</span><span class="lbl">reassigned to you</span>'+b.filter(function(x){return x[1]>0;}).map(function(x){ return '<span class="sb"><b class="num">'+x[1]+'</b> '+x[0]+'</span>'; }).join("")+'</div>' : '';
  return '<div class="page"><button class="back" data-tasks>&larr; Back</button><div class="ph"><div><h1>My assigned leads</h1><p>Fresh reassignments are listed counsellor-wise. Join each student\'s WhatsApp group to accept a reassigned lead.</p></div></div>'+strip+
    '<div class="dchips"><button class="chip'+(a.onlyRe?"":" on")+'" data-asg="0">All</button><button class="chip'+(a.onlyRe?" on":"")+'" data-asg="1">Reassigned <span class="num">'+all.length+'</span></button></div>'+
    (lots||'<div class="note">No reassigned leads yet.</div>')+own+
    '<div style="font-size:12px;color:var(--muted)">Mock: '+OWN_LEADS.length+' sample own leads plus every lead reassigned to you.</div></div>';
}

/* ---------- modal ---------- */
function showModal(html,cls){ var m=document.getElementById("modal"); m.innerHTML='<div class="modal" role="dialog" aria-modal="true"><div class="mbox'+(cls?" "+cls:"")+'">'+html+'</div></div>'; m.querySelectorAll('[data-m="close"]').forEach(function(b){b.onclick=closeModal;}); var f=m.querySelector("input,textarea,button.p"); if(f) f.focus(); }
function closeModal(){ document.getElementById("modal").innerHTML=""; }
/* Second layer for read-only views opened from another modal (the lead list), so closing it returns to
   the modal underneath instead of closing everything. Clicking the backdrop also closes it. */
function showModal2(html,cls){ var m=document.getElementById("modal2"); m.innerHTML='<div class="modal m2" role="dialog" aria-modal="true"><div class="mbox'+(cls?" "+cls:"")+'">'+html+'</div></div>';
  m.querySelectorAll('[data-m2="close"]').forEach(function(b){b.onclick=closeModal2;}); m.querySelector(".modal").onclick=function(e){ if(e.target===this) closeModal2(); }; var f=m.querySelector("input"); if(f) f.focus(); }
function closeModal2(){ document.getElementById("modal2").innerHTML=""; }
document.addEventListener("keydown",function(e){ if(e.key==="Escape"){ if(document.querySelector("#modal2 .modal, #modal2 .vtask")){ closeModal2(); return; } if(document.querySelector("#modal .modal")){ closeModal(); return; } closeBell(); closeWho(); if(S.drawerOpen){ S.drawerOpen=null; render(); } else if(S.tm){ closeTaskModal(); } } });

/* ---------- render ---------- */
function render(){
  var v=S.view, lead=(v==="ankit"||v==="vikram"||v==="rohit");
  renderDemo(); renderTop(); renderTabs();
  var m=document.getElementById("main"), html="";
  S.cur = "priya";
  if(v==="priya" && S.lv.priya.req && S.lv.priya.req.status==="deactivated") html=counselorHome();
  else if(S.route==="assigned" && v==="rahul") html=assignedPage();
  else if(S.route==="profile"){ S.cur="priya"; html = v==="priya"?counselorHome(): v==="vikram"?smHome(): (v==="ankit"||v==="rohit")?tlHome(): rahulProfile(); }
  else { S.route="home"; S.cur="priya"; html = S.activeTab==="tasks" ? tasksPerfPage() : ldPage(); }
  m.innerHTML=html;
  /* After building, bindings for the open reassign accordion (TL/SM on Tasks & Performance) act on S.focus. */
  if(!(S.route==="home"&&S.activeTab==="tasks")) S.tm=null;
  withLeaver("priya",renderTaskModal); lockScroll();
  var schedOpen = S.tm==="sched" && lead && S.focus && S.lv[S.focus];
  S.cur = schedOpen && S.focus && S.lv[S.focus] ? S.focus : "priya";
  m.querySelectorAll("[data-ld]").forEach(function(b){ b.onclick=function(){ S.route="home"; S.activeTab="ld"; render(); window.scrollTo(0,0); }; });
  m.querySelectorAll("[data-tasks]").forEach(function(b){ b.onclick=function(){ S.route="home"; S.activeTab="tasks"; S.tl.sel={}; render(); window.scrollTo(0,0); }; });
  if(S.route==="home"&&S.activeTab==="tasks"){ bindTasksPerf(); bindIbt(); if(S.tm==="lwd") bindSmHome(); if(S.tm==="sched") bindAssign(); }
  m.querySelectorAll("[data-asg]").forEach(function(b){ b.onclick=function(){ S.assigned.onlyRe=b.dataset.asg==="1"; render(); }; });
  document.querySelectorAll("#main [data-assignfor], #taskModal [data-assignfor]").forEach(function(b){ if(!b.onclick) b.onclick=function(e){ e.stopPropagation(); openSchedule(b.dataset.assignfor); }; });
  bindHandover();
  bindBreakdowns();
  bottomBar();
  document.getElementById("taskDrawer").innerHTML = S.route==="home"&&S.activeTab==="tasks" ? withLeaver("priya",renderTaskDrawer) : "";
  withLeaver("priya",bindTaskDrawer);
}
render();
})();

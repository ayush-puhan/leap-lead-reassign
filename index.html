<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Last Working Day Mockup</title>
<style>
:root{
  --nav:#0b1220; --nav-line:#2a3446; --bg:#eef2f7; --card:#ffffff; --line:#dbe3ee; --line-soft:#e9eef5;
  --ink:#141b2b; --muted:#5b6679; --faint:#8a94a6; --blue:#2f5bea; --blue-soft:#eaf0ff;
  --green:#16a34a; --green-soft:#e8f7ee; --red:#dc2626; --red-soft:#fdecec; --amber:#b45309; --amber-soft:#fff4e0;
  --grey-soft:#f1f3f7; --orange:#e5471d; --demo:#fff7d6; --demo-line:#f0d98a;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* demo bar */
.demo{background:var(--demo);border-bottom:1px solid var(--demo-line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px}
.demo b{font-weight:600}
.demo select,.demo button{border:1px solid #d9c476;background:#fff;border-radius:6px;padding:5px 10px;font-size:13px}
.demo button:hover{background:#fffbea}
.demo .sp{flex:1}
.demo .clock{color:#6b5a14}

/* crm chrome */
.top{background:var(--nav);color:#fff;display:flex;align-items:center;gap:14px;padding:8px 16px;min-height:50px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:.5px}
.logo i{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#4f7cff,#9b5cff);display:inline-block}
.search{flex:1;min-width:160px;max-width:320px;border:1px solid var(--nav-line);border-radius:4px;padding:7px 10px;color:#9aa6ba;font-size:13px}
.vbtn{border:1px solid #cfd6e2;border-radius:3px;padding:6px 14px;font-size:12px;font-weight:600}
.top .sp{flex:1}
.bell{position:relative;background:none;border:0;color:#fff;padding:4px 6px;font-size:18px}
.bell .dot{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;font-size:10px;border-radius:9px;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 4px}
.who{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.av{width:28px;height:28px;border-radius:50%;background:#3b4a6b;display:grid;place-items:center;font-size:11px}
.bellpanel{position:absolute;right:16px;top:96px;width:min(360px,calc(100vw - 32px));background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 30px rgba(15,23,42,.18);z-index:30}
.bellpanel h4{margin:0;padding:10px 14px;border-bottom:1px solid var(--line-soft);font-size:13px}
.bellpanel .n{padding:10px 14px;border-bottom:1px solid var(--line-soft);font-size:13px}
.bellpanel .n:last-child{border-bottom:0}
.bellpanel .n small{display:block;color:var(--faint);font-size:11px;margin-top:2px}
.bellpanel .n button{margin-top:6px}
.bellpanel .empty{padding:18px 14px;color:var(--muted);font-size:13px}
.tabs{background:#fff;display:flex;gap:4px;padding:0 8px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs span{padding:10px 8px;font-size:13px;color:#3a4458;white-space:nowrap}
.tabs .on{color:var(--blue);font-weight:600;border-bottom:2px solid var(--blue)}
.banner{background:linear-gradient(90deg,#3453e0,#8a3be3 55%,#4a4fe0);color:#fff;font-weight:700;font-size:13px;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.banner span.j{background:#fff;color:#3453e0;border-radius:3px;padding:2px 8px;font-weight:600;font-size:12px}
.filters{background:#fff;padding:8px 16px;display:flex;gap:6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.filters span{border:1px solid var(--line);border-radius:4px;padding:5px 12px;font-size:12px}

main{padding:20px 16px 110px;max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.rtk{align-self:flex-end;background:var(--orange);color:#fff;border:0;border-radius:4px;padding:8px 14px;font-weight:700;font-size:12px}
h2.sec{margin:6px 0 0;font-size:18px;letter-spacing:.3px}
.tix{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tix div{background:#fff;border:1px solid var(--line);border-radius:8px;text-align:center;padding:14px 8px}
.tix small{font-size:11px;font-weight:600;letter-spacing:.5px;color:#3a4458}
.tix b{display:block;font-size:34px;line-height:1.2}
@media (max-width:560px){.tix{grid-template-columns:1fr}}
.whomenu{position:absolute;right:16px;top:96px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(15,23,42,.18);z-index:31;min-width:180px;overflow:hidden}
.whomenu button{display:flex;gap:10px;align-items:center;width:100%;background:#fff;border:0;padding:11px 16px;font-size:14px;color:var(--ink);text-align:left}
.whomenu button:hover{background:#f6f8fb}
.whomenu button+button{border-top:1px solid var(--line-soft)}
.whomenu .out{color:var(--red)}
.pcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:16px}
.pcard .top2{display:flex;gap:16px;align-items:center}
.pav{width:60px;height:60px;border-radius:50%;background:#e8590c;color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;flex:none}
.pcard h2{margin:0;font-size:20px}
.pcard .r{color:var(--muted);font-size:13px}
.ptiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.ptiles div{background:#f1f4f9;border-radius:10px;padding:12px 14px}
.ptiles small{display:block;font-size:11px;font-weight:700;letter-spacing:.4px;color:#4b566b;text-transform:uppercase}
.ptiles b{font-size:14px}

.card{background:var(--card);border:1px solid var(--line);border-radius:8px}
.chead{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;background:none;border:0;text-align:left;color:inherit}
.ic{width:30px;height:30px;border-radius:7px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-size:15px;flex:none}
.chead .t{flex:1;min-width:0}
.chead .t b{display:block;font-size:14px}
.chead .t small{color:var(--muted);font-size:12px}
.chev{color:var(--muted);transition:transform .15s}
.open .chev{transform:rotate(180deg)}
.cbody{border-top:1px solid var(--line-soft);padding:16px;display:flex;flex-direction:column;gap:14px}

.note{background:var(--grey-soft);border-radius:6px;padding:10px 12px;font-size:13px;color:#39445a}
.stagegrid{display:flex;flex-wrap:wrap;gap:8px}
.stagegrid div{border:1px solid var(--line);border-radius:6px;padding:8px 12px;min-width:92px}
.stagegrid small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.stagegrid b{font-size:18px}
.stagegrid .tot{background:var(--blue-soft);border-color:#c9d6ff}
.stagepick{position:relative}
.stagepick .panel label.all{font-weight:600;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:4px}
.stagepick .panel{position:absolute;top:100%;left:0;margin-top:4px;z-index:25;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 30px rgba(15,23,42,.18);padding:8px;max-height:300px;overflow:auto;min-width:280px;display:flex;flex-direction:column;gap:1px}
.stagepick .hdr{display:flex;justify-content:space-between;align-items:center;padding:2px 6px 8px;margin-bottom:4px;border-bottom:1px solid var(--line-soft);font-size:12px;font-weight:700}
.stagepick label{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:4px;font-size:13px;font-weight:400;cursor:pointer}
.stagepick label:hover{background:#f6f8fb}

/* Tasks & Performance — visual language borrowed from the counselor CRM's own tab: red "boost"
   cards for Action Required output metrics, green for volume/quality input metrics, and per-task
   cards with a "How to close" explainer for pipeline drawers. Only Boost STI / Boost Deposit
   are real in this mockup — the rest is static dressing. */
.boosthead{display:flex;align-items:center;gap:10px;margin:18px 0 2px;font-size:12px;font-weight:800;letter-spacing:.4px;color:#4b566b;text-transform:uppercase}
.boosthead .bar{width:4px;height:16px;background:var(--blue);border-radius:2px;display:inline-block}
.boosthead .pill{margin-left:auto;font-size:10px;font-weight:700;padding:3px 10px;border-radius:999px;text-transform:none;letter-spacing:.2px}
.pill-red{background:#fde2e1;color:#b42318}
.pill-amber{background:var(--amber-soft);color:var(--amber)}
.boostgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:820px){.boostgrid{grid-template-columns:repeat(2,1fr)}}
.boostcard{border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:150px;cursor:pointer;border:1px solid transparent}
.boostcard.red{background:linear-gradient(180deg,#fdeceb,#fbe0df)}
.boostcard.red{border-color:#f6c9c7}
.boostcard.green{background:linear-gradient(180deg,#e8f7ee,#ddf3e6);border-color:#bfe6cf}
.boostcard .bhead{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.3px;color:#8a4a46}
.boostcard.green .bhead{color:#276745}
.boostcard .bnum{font-size:30px;font-weight:800;color:#c0342b;line-height:1}
.boostcard.green .bnum{color:#1c7a4a}
.boostcard .bsub{font-size:12px;color:#8a4a46}
.boostcard.green .bsub{color:#276745}
.boostcard .bdue{align-self:flex-start;background:rgba(255,255,255,.7);border-radius:5px;padding:2px 8px;font-size:11px;color:#8a4a46;font-weight:600}
.boostcard.green .bdue{color:#276745}
.boostcard .blink{margin-top:auto;font-size:12px;font-weight:700;color:#b42318}
.boostcard.green .blink{color:#1c7a4a}
.taskcard{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;background:#fff}
.taskcard .tchead b{font-size:14px;display:block}
.taskcard .tchead small{color:var(--muted);font-size:12px}
.taskcard .tcbadge{align-self:flex-start;background:var(--amber-soft);color:var(--amber);font-size:11px;font-weight:700;padding:3px 10px;border-radius:6px}
.htc{background:var(--grey-soft);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.htc .htclabel{font-size:10px;font-weight:800;letter-spacing:.5px;color:var(--muted);text-transform:uppercase}
.htc .htcchip{align-self:flex-start;background:var(--blue-soft);color:var(--blue);font-size:11px;font-weight:700;padding:3px 10px;border-radius:6px}
.htc p{margin:0;font-size:12px;color:#39445a;line-height:1.5}
.taskcard .tcbtns{display:flex;gap:8px}
.taskcard .tcbadges{display:flex;gap:6px;flex-wrap:wrap}
.taskcard .tcbadge.re{background:var(--blue-soft);color:var(--blue)}
.dchips{display:flex;gap:6px}
.dchips .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;color:#39445a}
.dchips .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.boostcard .bre{align-self:flex-start;background:rgba(255,255,255,.75);color:var(--blue);font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:#39445a}
input[type=date],select.in,textarea{border:1px solid #c8d1de;border-radius:6px;padding:8px 10px;font:inherit;color:var(--ink);background:#fff;max-width:100%}
textarea{min-height:80px;resize:vertical;width:100%}
.err{color:var(--red);font-size:12px;font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid #c8d1de;background:#fff;border-radius:6px;padding:8px 14px;font-weight:600;font-size:13px;color:var(--ink)}
.btn:hover{background:#f6f8fb}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.p:hover{background:#2449d4}
.btn.d{background:#fff;border-color:#f1b5b5;color:var(--red)}
.btn.d:hover{background:var(--red-soft)}
.btn.g{background:var(--green);border-color:var(--green);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12px}

.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.b-amber{background:var(--amber-soft);color:var(--amber)}
.b-blue{background:var(--blue-soft);color:var(--blue)}
.b-green{background:var(--green-soft);color:var(--green)}
.b-red{background:var(--red-soft);color:var(--red)}
.b-grey{background:var(--grey-soft);color:#5b6679}


.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:#f6f8fb;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#4b566b;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th.s{cursor:pointer}
td{padding:9px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.cl{cursor:pointer}tr.cl:hover td{background:#f8faff}
tr.sel td{background:#f2f6ff}
.un{color:var(--amber);font-weight:600}
.pag{display:flex;gap:8px;align-items:center;justify-content:flex-end;font-size:12px;color:var(--muted);padding:8px 0}

.page{display:flex;flex-direction:column;gap:14px}
.back{background:none;border:0;color:var(--blue);font-weight:600;padding:0;align-self:flex-start}
.ph{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between}
.ph h1{margin:0;font-size:20px;text-wrap:balance}
.ph p{margin:2px 0 0;color:var(--muted);font-size:13px}
.prog{min-width:220px}
.bar{height:8px;background:var(--line-soft);border-radius:5px;overflow:hidden;margin-top:5px}
.bar span{display:block;height:100%;background:var(--blue)}
.fbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
/* Every filter control is the same height and width so the row reads as one set. */
.fbar select.in,.fbar .stagepick>.btn{height:36px;width:170px;padding:0 10px;font-size:13px;font-weight:400;border:1px solid #c8d1de;border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:space-between;color:var(--ink)}
.fbar .seg{height:36px}
.fbar .seg button{height:34px;padding:0 14px;font-size:13px}
.seg{display:inline-flex;border:1px solid #c8d1de;border-radius:6px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 12px;font-size:12px;font-weight:600;color:#39445a}
.seg button.on{background:var(--blue);color:#fff}
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--nav);color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;z-index:20;box-shadow:0 -6px 20px rgba(0,0,0,.2)}
.bottom select{min-width:240px}

.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meta div small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.meta div b{font-size:14px}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{padding:8px 0 8px 16px;border-left:2px solid var(--line);position:relative;font-size:13px}
.hist li:before{content:"";position:absolute;left:-5px;top:13px;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.hist li small{color:var(--faint);display:block;font-size:11px}

.modal{position:fixed;inset:0;background:rgba(11,18,32,.5);display:grid;place-items:center;padding:16px;z-index:60}
.mbox{background:#fff;border-radius:10px;max-width:460px;width:100%;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.mbox h3{margin:0;font-size:17px}
.mbox.wide{max-width:720px}
.llist table td{white-space:normal}
.mbox p{margin:0;color:#39445a}
.drawerbg{position:fixed;inset:0;background:rgba(11,18,32,.35);z-index:45}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:#fff;z-index:46;box-shadow:-12px 0 30px rgba(15,23,42,.2);display:flex;flex-direction:column}
.drawer .dhead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-soft);flex:none}
.drawer .dhead button{background:none;border:0;font-size:18px;color:var(--muted);cursor:pointer;padding:2px 6px;line-height:1}
.drawer .dhead button:hover{color:var(--ink)}
.drawer .dhead b{font-size:16px;flex:1}
.drawer .dbody{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.dsearch{border:1px solid #c8d1de;border-radius:8px;padding:8px 10px;font:inherit;width:100%}
.dcount{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#4b566b}
.dcount .n{background:var(--grey-soft);border-radius:999px;padding:1px 9px;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:#111827;color:#fff;padding:9px 16px;border-radius:6px;font-size:13px;z-index:50}
.dead{max-width:420px;margin:60px auto;text-align:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:28px}
/* Last Working Day redesign */
.subh{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#4b566b;margin:6px 0 -4px}
.lab{font-size:12px;font-weight:600;color:#39445a;margin-bottom:6px}
.note.warn{background:var(--amber-soft);color:#7a3e06}
.note.bad{background:var(--red-soft)}
.note.ok{background:var(--green-soft)}
.ltot{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px;color:inherit}
.ltot:hover{border-color:#c9d6ff;background:#f8faff}
.ltot .n{font-size:26px;font-weight:800;line-height:1}
.ltot .lbl{font-size:13px;font-weight:600;color:#39445a}
.ltot .parts{flex-basis:100%;font-size:12px;color:var(--muted)}
.ltot .lnk{font-size:12px;font-weight:600;color:var(--blue)}
.hl{border-radius:8px;background:var(--blue-soft);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.hl.ok{background:var(--green-soft)}
.hl small{font-size:12px;color:var(--muted);font-weight:600}
.hl b{font-size:18px}
.hl span{font-size:13px;color:#39445a}
.otrack{display:grid;grid-template-columns:repeat(5,1fr)}
.ostep{position:relative;padding-top:30px;font-size:12px;color:var(--faint);text-align:center}
.ostep:before{content:"";position:absolute;top:10px;left:0;right:0;height:3px;background:var(--line)}
.ostep:first-child:before{left:50%}.ostep:last-child:before{right:50%}
.ostep i{position:absolute;top:0;left:50%;transform:translateX(-50%);width:23px;height:23px;border-radius:50%;background:#fff;border:2px solid var(--line);font-style:normal;font-size:11px;line-height:19px;font-weight:700;color:var(--faint)}
.ostep b{display:block;font-size:12px;color:inherit}
.ostep span{display:block;font-size:11px;padding:0 4px}
.ostep.done{color:var(--ink)}.ostep.done i{background:var(--green);border-color:var(--green);color:#fff}.ostep.done:before{background:var(--green)}
.ostep.cur{color:var(--blue)}.ostep.cur i{border-color:var(--blue);color:var(--blue)}
.ostep.end i{width:27px;height:27px;line-height:23px;top:-2px}
.ostep.end b{font-size:13px}
@media (max-width:620px){.otrack{grid-template-columns:1fr;gap:10px}.ostep{text-align:left;padding:0 0 0 36px;min-height:26px}.ostep:before{display:none}.ostep i{left:0;transform:none}}
.mbox.danger{padding-top:0;overflow:hidden}
.dhdr{background:var(--red);color:#fff;margin:0 -20px;padding:14px 20px;display:flex;flex-direction:column;gap:2px}
.dhdr b{font-size:17px}.dhdr span{font-size:13px;opacity:.95}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger:hover{background:#b91c1c}
.btn.danger-o{border-color:#f1b5b5;color:var(--red);background:#fff}
.btn.danger-o:hover{background:var(--red-soft)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kv small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.kv b{font-size:14px}

/* Order-tracker style status (like a delivery tracker): fixed start (LWD submitted) and fixed end
   (leads transfer on a known date at 8 PM), with every step and its date visible, then the LWD itself. */
function orderTracker(r){
  var st=r.status, tr=transferDate(r), asg=assignedCount(), tot=S.leads.length;
  var steps=[
    {t:"LWD submitted",d:r.tSub,done:true},
    {t:"SM approval",d:r.tApp||("Waiting for "+PEOPLE.vikram.name),done:st!=="pending"},
    {t:"TL schedules leads",d: moved(r)?"Done": st==="approved"?(asg+" of "+tot+" scheduled"):"After approval",done:moved(r)},
    {t:"Leads transfer",d:fmtDay(tr)+", 8 PM"+(st==="pending"?" (expected)":""),done:moved(r),end:true},
    {t:"Last working day",d:fmtDay(r.lwd)+" · leave Leap group chats",done:st==="deactivated"}
  ];
  var cur=steps.findIndex(function(x){return !x.done;});
  return '<div class="otrack">'+steps.map(function(x,i){
    var cls=x.done?"done":(i===cur?"cur":"");
    return '<div class="ostep '+cls+(x.end?" end":"")+'"><i>'+(x.done?"&#10003;":(i+1))+'</i><div><b>'+x.t+'</b><span>'+esc(x.d)+'</span></div></div>';
  }).join("")+'</div>';
}
function lwdHeadline(r){
  var tr=transferDate(r);
  if(moved(r)) return '<div class="hl ok"><small>Your leads moved on</small><b>'+fmtDay(tr)+', 8 PM</b><span>You stay in your students\' Leap group chats until your last working day, '+fmtDay(r.lwd)+', to help the new counselors settle in.</span></div>';
  return '<div class="hl"><small>Your leads transfer on</small><b>'+fmtDay(tr)+', 8 PM</b><span>'+(r.status==="pending"?"Expected date — confirmed once "+esc(PEOPLE.vikram.name)+" approves. ":"")+'You can tell your students this date. You stay in their Leap group chats until '+fmtDay(r.lwd)+'.</span></div>';
}
function transferPreview(dtIso){
  if(!dtIso) return '';
  var r={lwd:parseIso(dtIso)}; var tr=transferDate(r);
  return isShort(r) ? '<div class="note warn"><b>Less than '+OVERLAP_DAYS+' days away.</b> Your leads will transfer at 8 PM the day after your SM approves (if approved today: '+fmtDay(tr)+').</div>'
    : '<div class="note">Your leads will transfer on <b>'+fmtDay(tr)+', 8 PM</b> — '+OVERLAP_DAYS+' days before your last working day, so you overlap with the new counselors.</div>';
}

    showModal('<h3>Reject '+esc(LV().name)+'\'s last working day</h3><label class="f">Reason<textarea id="rr" maxlength="500" placeholder="For example: last working day doesn\'t match HR records"></textarea></label><div class="err" id="rrErr"></div><div class="row" style="justify-content:flex-end"><button class="btn" id="rrBack">Back</button><button class="btn d" id="rrSave">Reject</button></div>');
    document.getElementById("rrBack").onclick=function(){ smReview(id); };
    document.getElementById("rrSave").onclick=function(){ var v=document.getElementById("rr").value.trim(); if(!v){ document.getElementById("rrErr").textContent="Add a reason."; return; }
      withLeaver(id,function(){ S.req.status="rejected"; S.req.reason=v; S.req.tRej=now(); hist("Rejected: "+v,PEOPLE.vikram.name); notify(id,"Your last working day was rejected. Reason: "+v); });
      closeModal(); render(); toast("Rejected. "+PEOPLE[id].name+" has been told"); };
  });
}
function reopen(id){
  withLeaver(id,function(){ S.req.reopened=true; S.req.tReo=now(); hist("Reopened for counselor",PEOPLE.vikram.name); notify(id,"Your SM reopened your last working day request. Rejection reason: "+S.req.reason+". You can pick a new date and apply again."); });
  render(); toast("Reopened. "+PEOPLE[id].name+" can apply again");
}

/* ---------- request detail (SM, TL) ---------- */
/* Progress-aware CTA for the assignment screen, so whichever of the TL/SM looks second sees the true
   state rather than a plain "Assign leads" button. */
function assignCTA(showCancel){
  var asg=assignedCount(), tot=S.leads.length, complete=tot>0&&asg===tot, tr=transferDate(S.req);
  var label = complete ? "Review schedule" : (asg>0 ? "Continue scheduling" : "Schedule leads");
  var badge = complete ? ' <span class="badge b-green">All scheduled</span>' : (asg>0 ? ' <span class="badge b-amber">In progress</span>' : '');
  var note = complete ? '<div class="note ok">All '+tot+' leads are scheduled. You can still change any of them before '+fmtDay(tr)+', 8 PM.</div>'
    : (asg>0 ? '<div class="note">'+asg+' of '+tot+' leads scheduled so far.</div>' : '');
  var buttons = '<button class="btn '+(complete?"":"p")+'" data-assignfor="'+S.cur+'">'+label+'</button>'+(showCancel?'<button class="btn d" id="aCancel">Cancel</button>':'');
  return {note:note, buttons:buttons, badge:badge, asg:asg, tot:tot};
}
/* Who the leaver's leads are going to: one row per receiving counselor, plus an Unassigned row before transfer. */
function reassignTable(done){
  var by={}, un=[], tl=TLof(S.cur), tr=transferDate(S.req);
  S.leads.forEach(function(l){ var k=S.assign[l.id]; if(k){ (by[k]=by[k]||[]).push(l); } else un.push(l); });
  var keys=Object.keys(by).sort(function(a,b){return by[b].length-by[a].length;});
  function grp(ls){ var g=groupCounts(ls); return GROUP_ORDER.filter(function(k){return g[k].total>0;}).map(function(k){return GROUP_LABEL[k]+' '+g[k].total;}).join(' · '); }
  if(!keys.length && !done) return '<div class="note">Nothing scheduled yet. Anything left unscheduled at '+fmtDay(tr)+', 8 PM is split evenly across '+esc(tl.name)+'\'s team.</div>';
  var rows=keys.map(function(k){ var p=PEOPLE[k]; return '<tr><td><b>'+esc(p.name)+'</b></td><td>'+esc(PEOPLE[p.tl].name)+'</td><td class="num">'+by[k].length+'</td><td style="color:var(--muted)">'+grp(by[k])+'</td></tr>'; }).join("");
  if(un.length && !done) rows+='<tr><td><span class="badge b-amber">Unscheduled</span></td><td>—</td><td class="num">'+un.length+'</td><td style="color:var(--muted)">Split evenly across '+esc(tl.name)+'\'s team at transfer</td></tr>';
  return '<div class="tw"><table><thead><tr><th>Counselor</th><th>TL</th><th>Leads</th><th>By stage group</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function detailPage(){
  var r=S.req; var isSM=S.view==="vikram";
  if(!r) return '<button class="back" data-tasks>&larr; Back to Tasks &amp; Performance</button><div class="note">No request to show.</div>';
  var acts="", noteHtml="", tr=transferDate(r);
  if(isSM){
    if(r.status==="pending") acts='<button class="btn p" data-review="'+S.cur+'">Review</button>';
    if(r.status==="approved"){ var ab=assignCTA(true); noteHtml=ab.note; acts=ab.buttons; }
    if(r.status==="rejected" && !r.reopened) acts='<button class="btn" data-reopen="'+S.cur+'">Reopen for counselor</button>';
  } else if(r.status==="approved"){ var ab2=assignCTA(false); noteHtml=ab2.note; acts=ab2.buttons; }
  var reBlock = (r.status==="approved"||moved(r)) ? '<div class="card"><div class="cbody" style="border:0"><b>'+(moved(r)?"Leads transferred to":"Leads scheduled for")+'</b>'+reassignTable(moved(r))+'</div></div>' : '';
  var msgBlock = r.msgs ? '<div class="card"><div class="cbody" style="border:0"><b>Student messages</b><div class="row">'+["email","wa"].map(function(ch){ var c=msgCounts(ch); return '<span class="badge b-grey">'+(ch==="email"?"Email":"WhatsApp")+': <span class="num">'+c.Sent+' sent · '+c.Failed+' failed · '+c.Pending+' retrying</span></span>'; }).join("")+'</div></div></div>' : '';
  return '<div class="page"><button class="back" data-tasks>&larr; Back to Tasks &amp; Performance</button>'+
   '<div class="ph"><div><h1>'+esc(LV().name)+' · last working day</h1><p>'+esc(LV().role)+' · TL '+esc(TLof(S.cur).name)+' · SM '+esc(PEOPLE.vikram.name)+'</p></div>'+statusBadge(r.status)+'</div>'+
   '<div class="card"><div class="cbody" style="border:0"><div class="meta"><div><small>Submitted</small><b>'+esc(r.tSub)+'</b></div><div><small>SM approved</small><b>'+esc(r.tApp||"—")+'</b></div><div><small>Last working day</small><b>'+fmt(r.lwd)+'</b></div><div><small>Leads transfer</small><b>'+fmtShort(tr)+', 8 PM</b></div><div><small>Scheduled</small><b class="num">'+assignedCount()+' / '+S.leads.length+'</b></div></div>'+leadTotal(S.leads,S.cur)+
   (r.status==="rejected"?'<div class="note bad"><b>Rejection reason:</b> '+esc(r.reason)+(r.reopened?'<br>Reopened for the counselor on '+esc(r.tReo)+'. They can pick a new last working day and apply again.':'')+'</div>':'')+
   noteHtml+(acts?'<div class="row">'+acts+'</div>':'')+'</div></div>'+
   reBlock+msgBlock+
   '<div class="card"><div class="cbody" style="border:0"><b>History</b> <small style="color:var(--muted)">(latest request only)</small><ul class="hist">'+r.history.map(function(h){return '<li>'+esc(h.text)+' · '+esc(h.by)+'<small>'+esc(h.at)+'</small></li>';}).join("")+'</ul></div></div></div>';
}
function approve(newDate){
  var r=S.req, tl=TLof(S.cur);
  if(newDate){ r.changedFrom=r.lwd; hist("Last working day changed from "+fmt(r.lwd)+" to "+fmt(newDate),PEOPLE.vikram.name); r.lwd=newDate; }
  r.status="approved"; r.tApp=now(); r.appDay=TODAY;
  var tr=transferDate(r);
  hist("Approved. New lead allocation to "+LV().name+" stopped. Leads transfer "+fmt(tr)+", 8 PM",PEOPLE.vikram.name);
  notify(tl.id,"Schedule "+LV().name+"'s "+S.leads.length+" leads before "+fmt(tr)+", 8 PM.",{label:"Schedule leads",route:"home",tab:"tasks",tm:"sched",focus:S.cur});
  notify(S.cur,"Your last working day ("+fmt(r.lwd)+") was approved. Your leads transfer on "+fmt(tr)+", 8 PM.");
}
function bindDetail(){
  document.querySelectorAll("#taskModal [data-review]").forEach(function(b){ b.onclick=function(){ smReview(b.dataset.review); }; });
  document.querySelectorAll("#main [data-reopen]").forEach(function(b){ b.onclick=function(){ reopen(b.dataset.reopen); }; });

    document.getElementById("cc").onclick=function(){ withLeaver(id,function(){ S.req.status="cancelled"; S.req.tCan=now(); S.assign={}; hist("Cancelled. Assignments cleared and lead allocation restored",PEOPLE.vikram.name); notify(id,"Your last working day request was cancelled by "+PEOPLE.vikram.name+"."); notify(TLof(id).id,LV().name+"'s last working day request was cancelled. Scheduled assignments were cleared."); }); closeModal(); render(); toast("Request cancelled"); };
  };

/* ---------- TL assign ---------- */
/* Who can receive leads: active counselors under the same SM, excluding the leaver and anyone who
   has entered a last working day themselves. */
function eligible(){ return Object.keys(PEOPLE).map(function(k){return PEOPLE[k];}).filter(function(p){return p.role==="Counselor" && p.sm==="vikram" && p.id!==LV().id && !activeReq(p.id);}); }
function filtered(){
  var t=S.tl;
  var rows=S.leads.filter(function(l){
    if(t.stage.length&&t.stage.indexOf(l.stage)===-1) return false;
    if(t.grp.length&&t.grp.indexOf(leadGroup(l))===-1) return false;
    if(t.servicing!=="All"&&l.servicing!==t.servicing) return false;
    if(t.program!=="All"&&l.program!==t.program) return false;
    if(t.show==="Unscheduled"&&S.assign[l.id]) return false;
    if(t.show==="Scheduled"&&!S.assign[l.id]) return false;
    return true;
  });
  var k=t.sort, d=t.dir;
  rows.sort(function(a,b){
    var x,y;
    if(k==="next"||k==="last"){ x=a[k]?a[k].getTime():Infinity; y=b[k]?b[k].getTime():Infinity; if(x===y) return 0; return (x<y?-1:1)*d; }
    if(k==="to"){ x=S.assign[a.id]?PEOPLE[S.assign[a.id]].name:"~"; y=S.assign[b.id]?PEOPLE[S.assign[b.id]].name:"~"; }
    else { x=a[k]; y=b[k]; }
    return x<y?-d:x>y?d:0;
  });
  return rows;
}
function assignRowHtml(l,locked){
  var a=S.assign[l.id], sel=!!S.tl.sel[l.id];
  return '<tr class="'+(locked?"":"cl ")+(sel?"sel":"")+'"'+(locked?'':' data-rowsel="'+l.id+'"')+'><td><input type="checkbox" data-sel="'+l.id+'"'+(sel?" checked":"")+(locked?" disabled":"")+' aria-label="Select '+esc(l.name)+'"></td><td>'+esc(l.name)+'</td><td>'+l.id+'</td><td>'+esc(STAGE_LABEL[l.stage])+'</td><td>'+esc(prettyEnum(l.servicing))+'</td><td>'+esc(prettyEnum(l.program))+'</td><td class="num">'+fmtShort(l.last)+'</td><td class="num">'+fmtShort(l.next)+'</td><td>'+(a?'<span class="badge b-blue">'+esc(PEOPLE[a].name)+'</span>':'<span class="badge b-amber">Unscheduled</span>')+'</td></tr>';
}
/* Leavers this viewer schedules leads for: the TL sees their own team's, the SM sees everyone's. */
function assignLeavers(){
  return Object.keys(S.lv).filter(function(id){ var r=S.lv[id].req; if(!r||["approved","transferred"].indexOf(r.status)===-1) return false; return S.view==="vikram" || TLof(id).id===S.view; })
    .sort(function(a,b){ return transferDate(S.lv[a].req)-transferDate(S.lv[b].req); });
}
function assignBody(){
  var r=S.req, t=S.tl, locked=r.status!=="approved", tr=transferDate(r), tl=TLof(S.cur);
  var rows=filtered(), per=50, pages=Math.max(1,Math.ceil(rows.length/per)); if(t.page>=pages) t.page=pages-1;
  var slice=rows.slice(t.page*per,t.page*per+per);
  var asg=assignedCount(), tot=S.leads.length, nsel=Object.keys(t.sel).length;
  var allShownSel = rows.length && rows.every(function(l){return t.sel[l.id];});
  function optPretty(list,v){ return '<option value="All"'+(v==="All"?" selected":"")+'>All</option>'+list.map(function(x){return '<option value="'+x+'"'+(x===v?" selected":"")+'>'+esc(prettyEnum(x))+'</option>';}).join(""); }
  function th(key,label){ var ar = t.sort===key ? (t.dir===1?" &#9650;":" &#9660;") : ""; return '<th class="s" data-sort="'+key+'">'+label+ar+'</th>'; }
  var banner = locked ? '<div class="note ok"><b>Transfer complete.</b> This list is read only.</div>' :
    (tot>0&&asg===tot ? '<div class="note ok"><b>All '+tot+' leads are scheduled.</b> They move at '+fmtDay(tr)+', 8 PM — you can still change any of them until then.</div>'
      : '<div class="note">Nothing moves until <b>'+fmtDay(tr)+', 8 PM</b>. Anything left unscheduled then is split evenly across '+esc(tl.name)+'\'s team.</div>');
  var table = slice.length ? '<div class="tw"><table><thead><tr><th><input type="checkbox" id="selAll" aria-label="Select all shown"'+(allShownSel?" checked":"")+(locked?" disabled":"")+'></th>'+th("name","Student")+th("id","Lead ID")+th("stage","Stage")+th("servicing","Servicing type")+th("program","Program")+th("last","Last contacted")+th("next","Next follow-up")+th("to","Scheduled for")+'</tr></thead><tbody>'+
    slice.map(function(l){ return assignRowHtml(l,locked); }).join("")+
    '</tbody></table></div><div class="pag"><span class="num">'+(t.page*per+1)+'–'+(t.page*per+slice.length)+' of '+rows.length+'</span><button class="btn sm" id="pPrev"'+(t.page?"":" disabled")+'>Previous</button><button class="btn sm" id="pNext"'+(t.page<pages-1?"":" disabled")+'>Next</button></div>'
    : '<div class="note">No leads match these filters.</div>';
  var stageLabel = (!t.stage.length || t.stage.length===STAGES.length) ? "All stages" : (t.stage.length===1 ? prettyEnum(t.stage[0]) : t.stage.length+" stages selected");
  var stagePicker = '<div class="f"><span>Stage</span><div class="stagepick"><button type="button" class="btn sm" id="stageBtn">'+esc(stageLabel)+' &#8964;</button>'+
    (t.stageMenuOpen ? '<div class="panel"><div class="hdr"><span>Stage (select any number)</span><button type="button" class="btn sm" id="stageClear">Clear</button></div>'+
      '<label class="all"><input type="checkbox" id="stageAll"'+(t.stage.length===STAGES.length?" checked":"")+'> Select all</label>'+
      STAGES.map(function(s){return '<label><input type="checkbox" data-stagechk="'+s+'"'+(t.stage.indexOf(s)!==-1?" checked":"")+'> '+esc(prettyEnum(s))+'</label>';}).join("")+
      '</div>' : '')+
    '</div></div>';
  var grpLabel = (!t.grp.length || t.grp.length===GROUP_ORDER.length) ? "All groups" : (t.grp.length===1 ? GROUP_LABEL[t.grp[0]] : t.grp.length+" groups selected");
  var groupPicker = '<div class="f"><span>Group</span><div class="stagepick"><button type="button" class="btn sm" id="grpBtn">'+esc(grpLabel)+' &#8964;</button>'+
    (t.grpMenuOpen ? '<div class="panel"><div class="hdr"><span>Group (select any number)</span><button type="button" class="btn sm" id="grpClear">Clear</button></div>'+
      '<label class="all"><input type="checkbox" id="grpAll"'+(t.grp.length===GROUP_ORDER.length?" checked":"")+'> Select all</label>'+
      GROUP_ORDER.map(function(k){return '<label><input type="checkbox" data-grpchk="'+k+'"'+(t.grp.indexOf(k)!==-1?" checked":"")+'> '+esc(GROUP_LABEL[k])+'</label>';}).join("")+
      '</div>' : '')+
    '</div></div>';
  var selbar = !locked ? '<div class="selbar">'+(nsel?'<b class="num">'+nsel+' selected</b><button class="btn sm danger-o" id="selClear">Clear selection</button>':'<span style="color:var(--muted)">Click rows to select them, then pick who to schedule them for.</span>')+
    '</div>' : '';
  return banner+
    '<div class="fbar">'+stagePicker+groupPicker+'<label class="f">Servicing type<select class="in" id="fServicing">'+optPretty(SERVICING_TYPES,t.servicing)+'</select></label><label class="f">Program<select class="in" id="fProg">'+optPretty(PROGRAM_TYPES,t.program)+'</select></label>'+
    '<div class="f" style="display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:#39445a">Show<div class="seg">'+["All","Unscheduled","Scheduled"].map(function(s){return '<button data-show="'+s+'" class="'+(t.show===s?"on":"")+'">'+s+'</button>';}).join("")+'</div></div></div>'+
    selbar+table;
}
/* Leads to schedule, inline on the View Profile page: one accordion per leaver, one open at a time.
   Opening a leaver expands their leads right here instead of switching to a different screen. Pending
   leavers (TL view) are listed but can't be opened until the SM approves. */
function scheduleCard(){
  var ids=assignLeavers();
  var pend = S.view==="ankit" ? Object.keys(S.lv).filter(function(id){ var r=S.lv[id].req; return r&&r.status==="pending"&&TLof(id).id==="ankit"; }) : [];
  if(S.focus && ids.indexOf(S.focus)===-1) S.focus=null;
  var acc=ids.map(function(id){
    return withLeaver(id,function(){
      var r=S.req, open=id===S.focus, asg=assignedCount(), tot=S.leads.length, tr=transferDate(r);
      return '<div class="card acc2'+(open?" open":"")+'" id="acc-'+id+'"><button class="chead" data-acc="'+id+'" aria-expanded="'+open+'"><span class="av2">'+PEOPLE[id].name.split(" ").map(function(x){return x[0];}).join("")+'</span><span class="t"><b>'+esc(PEOPLE[id].name)+'</b><small>LWD '+fmt(r.lwd)+' · leads move '+fmtDay(tr)+', 8 PM</small></span>'+
        '<span class="prog2"><span class="num">'+asg+' / '+tot+' scheduled</span><span class="bar"><span style="width:'+(tot?asg/tot*100:0)+'%"></span></span></span>'+statusBadge(r.status)+'<span class="chev">&#8964;</span></button>'+
        (open?'<div class="cbody">'+assignBody()+'</div>':'')+'</div>';
    });
  }).join("");
  var waiting=pend.map(function(id){ var r=S.lv[id].req; return '<div class="lrow"><div><b>'+esc(PEOPLE[id].name)+'</b> '+statusBadge("pending")+'<br><small>LWD '+fmt(r.lwd)+' · you can schedule once the SM approves</small></div></div>'; }).join("");
  return '<p class="tmsub">Open a counselor to schedule who gets each lead. Leads only move at 8 PM on their transfer date.</p>'+
    (acc||waiting?acc+(waiting?'<div class="card"><div class="cbody" style="border:0;padding:4px 16px">'+waiting+'</div></div>':''):'<div class="note">No leads to schedule right now.</div>');
}
function openSchedule(id){ S.focus=id; S.tl.sel={}; S.tl.page=0; S.route="home"; S.activeTab="tasks"; S.tm="sched"; render(); var el=document.getElementById("acc-"+id); if(el) el.scrollIntoView({block:"start"}); }
function bottomBar(){
  var el=document.getElementById("tmFoot");
  var n=Object.keys(S.tl.sel).length;
  if(!el) return;
  if(S.tm!=="sched"||!S.focus||S.cur!==S.focus||!n||!S.req||S.req.status!=="approved"){ el.innerHTML=""; return; }
  el.innerHTML='<div class="tmfoot"><b class="num">'+n+' selected</b><select class="in" id="asgTo"><option value="">Schedule for…</option>'+eligible().map(function(p){ var tl=PEOPLE[p.tl].name; var cur=p.open+Object.keys(S.assign).filter(function(k){return S.assign[k]===p.id;}).length; return '<option value="'+p.id+'">'+esc(p.name)+' · '+esc(tl)+' · '+cur+' existing open leads</option>'; }).join("")+'</select><button class="btn p" id="asgGo" disabled>Schedule assignment</button></div>';
  var s=document.getElementById("asgTo"), g=document.getElementById("asgGo");
  s.onchange=function(){ g.disabled=!s.value; };
  g.onclick=function(){
    var who=s.value, ids=Object.keys(S.tl.sel), id=S.cur, r=S.req, tr=transferDate(r);
    showModal('<h3>Schedule assignment?</h3><div class="kv"><div><small>Schedule for</small><b>'+esc(PEOPLE[who].name)+'</b></div><div><small>Leads</small><b class="num">'+ids.length+' of '+esc(LV().name)+'\'s</b></div><div><small>Last working day</small><b>'+fmtDay(r.lwd)+'</b></div><div><small>Leads move</small><b>'+fmtDay(tr)+', 8 PM</b></div></div>'+
      '<div class="note">Nothing moves now. '+esc(PEOPLE[who].name)+' becomes the owner at '+fmtDay(tr)+', 8 PM. You can change this any time before then.</div>'+
      '<div class="row" style="justify-content:flex-end"><button class="btn" data-m="close">Back</button><button class="btn p" id="schGo">Schedule</button></div>');
    document.getElementById("schGo").onclick=function(){
      withLeaver(id,function(){ ids.forEach(function(x){ S.assign[x]=who; }); hist("Scheduled "+ids.length+" leads for "+PEOPLE[who].name+" (move "+fmt(tr)+", 8 PM)",me().name); });
      S.tl.sel={}; closeModal(); render(); toast(ids.length+" leads scheduled for "+PEOPLE[who].name);
    };
  };
}
function bindAssign(){
  var t=S.tl;
  function on(id,ev,fn){ var e=document.getElementById(id); if(e) e[ev]=fn; }
  /* Only one filter panel open at a time: opening one, or using any other filter, closes the rest. */
  function closeMenus(){ t.stageMenuOpen=false; t.grpMenuOpen=false; }
  /* Close without a re-render, so the click that triggered it still reaches its target. */
  function dropMenus(){ if(!t.stageMenuOpen&&!t.grpMenuOpen) return; closeMenus(); document.querySelectorAll(".stagepick .panel").forEach(function(p){p.remove();}); }
  on("stageBtn","onclick",function(){ var o=!t.stageMenuOpen; closeMenus(); t.stageMenuOpen=o; render(); });
  on("stageClear","onclick",function(){ t.stage=[]; t.page=0; render(); });
  on("stageAll","onchange",function(e){ t.stage=e.target.checked?STAGES.slice():[]; t.page=0; render(); });
  document.querySelectorAll("[data-stagechk]").forEach(function(c){ c.onchange=function(){
    var v=c.dataset.stagechk, i=t.stage.indexOf(v);
    if(c.checked){ if(i===-1) t.stage.push(v); } else if(i!==-1) t.stage.splice(i,1);
    t.page=0; render();
  }; });
  on("grpBtn","onclick",function(){ var o=!t.grpMenuOpen; closeMenus(); t.grpMenuOpen=o; render(); });
  on("grpClear","onclick",function(){ t.grp=[]; t.page=0; render(); });
  on("grpAll","onchange",function(e){ t.grp=e.target.checked?GROUP_ORDER.slice():[]; t.page=0; render(); });
  document.querySelectorAll("[data-grpchk]").forEach(function(c){ c.onchange=function(){
    var v=c.dataset.grpchk, i=t.grp.indexOf(v);
    if(c.checked){ if(i===-1) t.grp.push(v); } else if(i!==-1) t.grp.splice(i,1);
    t.page=0; render();
  }; });
  on("fServicing","onchange",function(e){ closeMenus(); t.servicing=e.target.value; t.page=0; render(); });
  on("fProg","onchange",function(e){ closeMenus(); t.program=e.target.value; t.page=0; render(); });
  document.querySelectorAll("[data-show]").forEach(function(b){ b.onclick=function(){ closeMenus(); t.show=b.dataset.show; t.page=0; render(); }; });
  /* Clicking anywhere outside an open panel closes it. */
  document.onmousedown=function(e){ if(!e.target.closest(".stagepick")) dropMenus(); };
  document.querySelectorAll("[data-sort]").forEach(function(h){ h.onclick=function(){ var k=h.dataset.sort; if(t.sort===k) t.dir=-t.dir; else { t.sort=k; t.dir=1; } render(); }; });
  document.querySelectorAll("[data-sel]").forEach(function(c){ c.onclick=function(e){ e.stopPropagation(); }; c.onchange=function(){ if(c.checked) t.sel[c.dataset.sel]=1; else delete t.sel[c.dataset.sel]; render(); }; });
  /* Whole row toggles selection, not just the checkbox. */

/* ---------- 8 PM transfer ---------- */
function runTransfer(){
  S.cur="priya";
  var r=S.req; if(!r||r.status!=="approved") return;
  S.clock=fmt(transferDate(r))+", 8:00 PM";
  // 1. auto split leftovers across the TL team, fewest open leads first
  var pool=eligible().filter(function(p){return p.tl===LV().tl;});
  var load=function(p){ return p.open+Object.keys(S.assign).filter(function(k){return S.assign[k]===p.id;}).length; };
  pool.sort(function(a,b){return load(a)-load(b);});
  var left=S.leads.filter(function(l){return !S.assign[l.id];}).sort(function(a,b){return a.id<b.id?-1:1;});
  left.forEach(function(l,i){ S.assign[l.id]=pool[i%pool.length].id; });
  if(left.length) hist("Auto split "+left.length+" unscheduled leads across "+PEOPLE.ankit.name+"'s team","System");
  // 2. move leads, 3. queue messages
  hist("Moved "+S.leads.length+" leads with open tasks, follow-ups and history","System");
  r.msgs={};
  S.leads.forEach(function(l){
    var e = !l.email ? {s:"Failed",why:"No email on lead",at:now()} : l.flaky ? {s:"Pending",why:"",at:now()} : {s:"Sent",at:now()};
    var w = !l.phone ? {s:"Failed",why:"No phone on lead",at:now()} : (l.flaky&&l.email) ? {s:"Pending",why:"",at:now()} : {s:"Sent",at:now()};
    r.msgs[l.id]={email:e,wa:w};
  });
  hist("Sent student emails and WhatsApp messages; failed sends will retry 3 times over 1 hour","System");
  // 4. tasks + bells
  var per={}; S.leads.forEach(function(l){ per[S.assign[l.id]]=(per[S.assign[l.id]]||0)+1; });
  Object.keys(per).forEach(function(k){ notify(k,"You received "+per[k]+" leads from "+LV().name+"."); });
  hist("Created "+S.leads.length+" Leap group chat intro tasks for new counselors","System");
  r.status="transferred"; r.tTr=now();
  hist(LV().name+" stays active in the students' Leap group chats until "+fmt(r.lwd),"System");
  notify("priya","Your "+S.leads.length+" leads moved to new counselors. You stay in your students' Leap group chats until "+fmt(r.lwd)+".");
  S.phase="retrying"; S.tl.sel={};
  render(); toast("Transfer done");
}
function finishRetries(){
  S.cur="priya";
  if(S.phase!=="retrying") return;
  S.clock=fmt(transferDate(S.req))+", 9:00 PM";
  var i=0;
  Object.keys(S.req.msgs).forEach(function(k){ var m=S.req.msgs[k]; ["email","wa"].forEach(function(ch){ if(m[ch].s==="Pending"){ i++; m[ch]= (i%2) ? {s:"Failed",why: ch==="email"?"Mailbox unavailable (550)":"Number not on WhatsApp",at:now()} : {s:"Sent",at:now()}; } }); });
  hist("Retries finished. Final Sent / Failed counts updated on the Handovers card","System");
  S.phase="done"; render(); toast("Retries finished");
}

   list drops the record from here on. */
function jumpToLwd(){
  S.cur="priya";
  var r=S.req; if(!r||r.status!=="transferred") return;
  S.clock=fmt(r.lwd)+", 8:00 PM"; if(S.phase==="retrying") S.phase="done";
  r.status="deactivated";
  hist(LV().name+" removed from "+S.leads.length+" Leap group chats; CRM login deactivated","System");
  render(); toast("Last working day: login deactivated");
}

/* ---------- modal ---------- */
function showModal(html,cls){ var m=document.getElementById("modal"); m.innerHTML='<div class="modal" role="dialog" aria-modal="true"><div class="mbox'+(cls?" "+cls:"")+'">'+html+'</div></div>'; m.querySelectorAll('[data-m="close"]').forEach(function(b){b.onclick=closeModal;}); var f=m.querySelector("input,textarea,button.p"); if(f) f.focus(); }
function closeModal(){ document.getElementById("modal").innerHTML=""; }
document.addEventListener("keydown",function(e){ if(e.key==="Escape"){ if(document.querySelector("#modal .modal")){ closeModal(); return; } closeBell(); closeWho(); if(S.drawerOpen){ S.drawerOpen=null; render(); } else if(S.tm){ closeTaskModal(); } } });

/* ---------- render ---------- */
function render(){
  var v=S.view, lead=(v==="ankit"||v==="vikram");
  renderDemo(); renderTop(); renderTabs();
  var m=document.getElementById("main"), html="";
  S.cur = S.route==="detail" && S.focus && S.lv[S.focus] ? S.focus : "priya";
  if(S.lv.priya.req && S.lv.priya.req.status==="deactivated" && v==="priya"){ S.cur="priya"; html=counselorHome(); }
  else if(S.route==="detail" && lead) html=detailPage();
  else if(S.route==="profile"){ S.cur="priya"; html = v==="priya"?counselorHome(): v==="vikram"?smHome(): v==="ankit"?tlHome(): rahulProfile(); }
  else { S.route="home"; S.cur="priya"; html = S.activeTab==="tasks" ? tasksPerfPage() : ldPage(); }
  m.innerHTML=html;
  /* After building, bindings for the open scheduling accordion (TL/SM on Tasks & Performance) act on S.focus. */
  if(!(S.route==="home"&&S.activeTab==="tasks")) S.tm=null;
  withLeaver("priya",renderTaskModal);
  var schedOpen = S.tm==="sched" && lead && S.focus && S.lv[S.focus];
  S.cur = (S.route==="detail"||schedOpen) && S.focus && S.lv[S.focus] ? S.focus : "priya";
  m.querySelectorAll("[data-ld]").forEach(function(b){ b.onclick=function(){ S.route="home"; S.activeTab="ld"; render(); window.scrollTo(0,0); }; });
  m.querySelectorAll("[data-tasks]").forEach(function(b){ b.onclick=function(){ S.route="home"; S.activeTab="tasks"; S.tl.sel={}; render(); window.scrollTo(0,0); }; });
  if(S.route==="home"&&S.activeTab==="tasks"){ bindTasksPerf(); bindIbt(); if(S.tm==="lwd") bindSmHome(); if(S.tm==="sched") bindAssign(); }
  if(S.route==="profile"&&v==="priya") bindResignation();
  if(S.route==="detail") bindDetail();
  if(v==="rahul"&&S.route==="home") bindRahul();
  document.querySelectorAll("#main [data-assignfor], #taskModal [data-assignfor]").forEach(function(b){ if(!b.onclick) b.onclick=function(e){ e.stopPropagation(); openSchedule(b.dataset.assignfor); }; });
  document.querySelectorAll("#main [data-detailfor], #taskModal [data-detailfor]").forEach(function(b){ if(!b.onclick) b.onclick=function(e){ e.stopPropagation(); S.tm=null; S.focus=b.dataset.detailfor; S.route="detail"; render(); window.scrollTo(0,0); }; });
  bindBreakdowns();
  bottomBar();
  document.getElementById("taskDrawer").innerHTML = S.route==="home"&&S.activeTab==="tasks" ? withLeaver("priya",renderTaskDrawer) : "";
  withLeaver("priya",bindTaskDrawer);
}
render();
})();
</script>
</body>
</html>
